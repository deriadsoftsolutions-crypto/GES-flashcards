a":"Coercive power","d":["Reward power","Referent power","Expert power"]},{"c":5,"g":"power-types","q":"Which type of power rests on the ability to control and administer rewards to those who comply?","a":"Reward power","d":["Coercive power","Legitimate power","Referent power"]},{"c":5,"g":"power-types","q":"Who said that nothing else can quite substitute for a few well-chosen, well-timed, sincere words of praise?","a":"Huey (1992)","d":["Gardner (1995)","Berkley (2004)","Bush (2011)"]},{"c":5,"g":"power-types","q":"Which type of power is derived from an individual's POSITION or role in the institutional hierarchy?","a":"Legitimate/legal power","d":["Expert power","Referent power","Reward power"]},{"c":5,"g":"power-types","q":"Which type of power is derived from superior competence, special ability, skills or knowledge?","a":"Expert power","d":["Legitimate power","Referent power","Coercive power"]},{"c":5,"g":"power-types","q":"Which type of power is derived from the RESPECT employees have for a leader and their desire to identify with or emulate him?","a":"Referent power","d":["Expert power","Legitimate power","Reward power"]},{"c":5,"g":"power-types","q":"Referent power may also be referred to as what?","a":"Charismatic power","d":["Legitimate power","Expert power","Coercive power"]},{"c":5,"g":"styles","q":"Which leadership style is domineering, where the leader alone determines policies and assigns tasks without consultation?","a":"Autocratic/Authoritarian/Dictatorial","d":["Democratic","Laissez-faire","Transformational"]},{"c":5,"g":"styles","q":"Under which leadership style are opposing views seen as attempts to overthrow the leader's dynasty?","a":"Autocratic leadership","d":["Democratic leadership","Laissez-faire leadership","Transactional leadership"]},{"c":5,"g":"styles","q":"Which leadership style arrives at policies through discussions and group decisions?","a":"Democratic leadership","d":["Autocratic leadership","Laissez-faire leadership","Transactional leadership"]},{"c":5,"g":"styles","q":"Under which leadership style does the leader consider himself 'first among equals'?","a":"Democratic leadership","d":["Autocratic leadership","Transformational leadership","Laissez-faire leadership"]},{"c":5,"g":"styles","q":"Which leadership style is characterised by cooperation, enthusiasm, acceptance of more responsibility and recognition of each worker's worth?","a":"Democratic leadership","d":["Autocratic leadership","Laissez-faire leadership","Transactional leadership"]},{"c":5,"g":"styles","q":"'Laissez-faire' literally means what?","a":"'Let them do what they wish'","d":["'Let the leader decide'","'Work together'","'Leave it to the group'"]},{"c":5,"g":"styles","q":"Which leadership style grants complete freedom or autonomy to staff, with no hard and fast rules?","a":"Laissez-faire (anarchic) leadership","d":["Democratic leadership","Autocratic leadership","Transformational leadership"]},{"c":5,"g":"styles","q":"Under which leadership style are individual decisions allowed without the leader's participation?","a":"Laissez-faire leadership","d":["Democratic leadership","Autocratic leadership","Transactional leadership"]},{"c":5,"g":"styles","q":"Who defined a transformational leader as a person who stimulates and inspires followers to achieve extraordinary outcomes?","a":"Robbins and Coulter (2004)","d":["Astin and Leland (1991)","Gardner (1995)","Hargis (2001)"]},{"c":5,"g":"styles","q":"Which leadership style changes followers' awareness of issues by helping them look at old problems in a new way?","a":"Transformational leadership","d":["Transactional leadership","Autocratic leadership","Laissez-faire leadership"]},{"c":5,"g":"styles","q":"Which leadership style promotes compliance through REWARDS AND PUNISHMENTS?","a":"Transactional leadership","d":["Transformational leadership","Democratic leadership","Laissez-faire leadership"]},{"c":5,"g":"styles","q":"Transactional leadership is also known as what?","a":"Managerial leadership","d":["Charismatic leadership","Referent leadership","Collegial leadership"]},{"c":5,"g":"styles","q":"How do transactional leaders differ from transformational leaders regarding the future?","a":"They are NOT looking to change the future — they merely want to keep things the same","d":["They inspire radical change","They delegate the future to followers","They ignore the future entirely"]},{"c":5,"g":"styles","q":"In which situations is transactional leadership described as effective?","a":"In crisis and emergency situations, and when projects need to be carried out in a specific fashion","d":["In long-term institutional reform","In collegial professional settings","In laissez-faire environments"]},{"c":5,"g":"styles","q":"Transactional leadership focuses on which level of Maslow's hierarchy?","a":"Lower-level needs (Hargis, 2001)","d":["Higher-level needs","Self-actualisation","Esteem needs"]},{"c":5,"g":"edu-mgmt","q":"Who defines educational management as a field of study and practice concerned with the operations of educational organisations?","a":"Bush (2011)","d":["Campbell et al (1973)","Burdett (1995)","Keith (1991)"]},{"c":5,"g":"edu-mgmt","q":"According to Bush (2003), what provides the crucial sense of direction for educational institutions?","a":"Their purposes or aims","d":["Their leadership style","Their financial resources","Their governing body"]},{"c":5,"g":"edu-mgmt","q":"What may be the mission statement of management, per Bush?","a":"The pursuit of efficiency","d":["The pursuit of equity","The pursuit of excellence","The pursuit of accountability"]},{"c":5,"g":"bush-models","q":"In Bush's model, which LEADERSHIP style is linked with the FORMAL management model?","a":"Managerial","d":["Transformational","Transactional","Postmodern"]},{"c":5,"g":"bush-models","q":"In Bush's model, which LEADERSHIP style is linked with the COLLEGIAL management model?","a":"Transformational","d":["Managerial","Transactional","Moral"]},{"c":5,"g":"bush-models","q":"In Bush's model, which LEADERSHIP style is linked with the POLITICAL management model?","a":"Transactional","d":["Transformational","Managerial","Emotional"]},{"c":5,"g":"bush-models","q":"In Bush's model, which LEADERSHIP style is linked with the SUBJECTIVE management model?","a":"Postmodern","d":["Emotional","Moral","Managerial"]},{"c":5,"g":"bush-models","q":"In Bush's model, which LEADERSHIP style is linked with the AMBIGUITY management model?","a":"Emotional","d":["Postmodern","Moral","Transactional"]},{"c":5,"g":"bush-models","q":"In Bush's model, which LEADERSHIP style is linked with the CULTURAL management model?","a":"Moral","d":["Emotional","Postmodern","Transformational"]},{"c":5,"g":"mgmt-models","q":"Which management model is an umbrella term covering structural, systems, bureaucratic, rational and hierarchical models?","a":"The formal model","d":["The collegial model","The political model","The cultural model"]},{"c":5,"g":"mgmt-models","q":"Which management model emphasises the official and structural elements of an organisation as a hierarchical system?","a":"The formal model","d":["The subjective model","The ambiguity model","The cultural model"]},{"c":5,"g":"mgmt-models","q":"Which management model is practised where a greater proportion of employees are professionals, and shares power and decision-making?","a":"The collegial model","d":["The formal model","The political model","The subjective model"]},{"c":5,"g":"mgmt-models","q":"Who said collegiality can broadly be defined as teachers conferring and collaborating with other teachers?","a":"Burdett (1995)","d":["Bush (2011)","Campbell et al (1977)","Keith (1991)"]},{"c":5,"g":"mgmt-models","q":"Which management model is characterised by decision-making as a BARGAINING process among sub-groups?","a":"The political model","d":["The collegial model","The formal model","The ambiguity model"]},{"c":5,"g":"mgmt-models","q":"Which management model focuses on INDIVIDUALS in the organisation ded for the running of all other organisations","d":["Because it employs the most people","Because it costs the most money","Because it is compulsory"]},{"c":5,"g":"admin-features","q":"Besides producing labour, what is the school charged with in society?","a":"Socialising, politicising and acculturating the child","d":["Providing employment for graduates","Housing and feeding children","Regulating community behaviour"]},{"c":5,"g":"admin-features","q":"On a continuum of least to most intimate, where does teaching lie relative to toothpaste production and tax collection?","a":"Further to the RIGHT (more intimate)","d":["Further to the left (less intimate)","At the same point","Off the continuum"]},{"c":5,"g":"admin-features","q":"What is the 'raw material' of education?","a":"Pupils/students","d":["Teaching and learning materials","The curriculum","School buildings"]},{"c":5,"g":"admin-features","q":"How do the raw materials of education differ from those of other organisations?","a":"Students react to the administrator as human beings and report the administrator's activities to parents, opinion leaders and the community","d":["They are cheaper to obtain","They can be stored indefinitely","They require no processing"]},{"c":5,"g":"admin-features","q":"Why do school staff require special administrative techniques?","a":"Because teachers are mostly PROFESSIONALS who need autonomy and collaboration in their work","d":["Because teachers are poorly paid","Because teachers are numerous","Because teachers work part-time"]},{"c":5,"g":"admin-features","q":"According to Campbell et al (1977), on a continuum of professionalism, where does the school lie relative to the factory and hospital?","a":"To the RIGHT of the factory and hospital","d":["To the left of both","Between the factory and the hospital","At the same point as the hospital"]},{"c":5,"g":"admin-features","q":"Why is the process of education described as a 'double-edged sword' and an eye opener?","a":"Because it ":"Under Taylor's principles, why must workers have clearly defined daily tasks?","a":"So the worker will not laze about, and so praise/blame and reward/punishment can be easily apportioned","d":["So workers can choose their own hours","So supervisors can be reduced","So pay can be equalised"]},{"c":5,"g":"taylor","q":"Under Taylor, what determines one's pay?","a":"The extent to which one is able to perform one's task","d":["One's seniority in the organisation","One's qualifications","The organisation's profits"]},{"c":5,"g":"fayol","q":"What was Henry Fayol's profession?","a":"A French mining engineer","d":["An American industrial engineer","A British civil servant","An American political scientist"]},{"c":5,"g":"fayol","q":"Name Fayol's four tasks of the administrator.","a":"Planning, Organisation, Co-ordinating and Control","d":["Planning, Organising, Staffing and Directing","Planning, Directing, Reporting and Budgeting","Organising, Coordinating, Reporting and Controlling"]},{"c":5,"g":"fayol","q":"Under Fayol, which task means the leader studies and arranges the general overview and plan of tasks?","a":"Planning","d":["Organisation","Co-ordinating","Control"]},{"c":5,"g":"fayol","q":"Under Fayol, which task means the administrator unites and correlates all activities in the organisation?","a":"Co-ordinating","d":["Organisation","Control","Planning"]},{"c":5,"g":"fayol","q":"Under Fayol, which task means seeing that everything is done in accordance with the rules laid down?","a":"Control","d":["Co-ordinating","Organisation","Planning"]},{"c":5,"g":"fayol","q":"According to Fayol, what is the administrator's position in the organisation?","a":"The chief executive, who must develop a formal hierarchical structure and specify roles and responsibilities","d":["A first among equals","A facilitator of group decisions","A servant of the staff"]},{"c":5,"g":"fayol","q":"According to Fayol, which two things are the responsibilities of the administrator?","a":"Maintenance of discipline and free flow of communication","d":["Budgeting and staffing","Reporting and coordinating","Planning and evaluating"]},{"c":5,"g":"posdcorb","q":"Who came up with POSDCORB as the work of the administrator?","a":"Luther Gulick","d":["Henry Fayol","Frederick Taylor","Peter Drucker"]},{"c":5,"g":"posdcorb","q":"What does POSDCORB stand for?","a":"Planning, Organising, Staffing, Directing, Co-ordinating, Reporting and Budgeting","d":["Planning, Organising, Supervising, Delegating, Controlling, Reviewing and Balancing","Policy, Organisation, Staffing, Development, Control, Reporting and Budgeting","Planning, Operations, Staffing, Directing, Communicating, Reporting and Budgeting"]},{"c":5,"g":"posdcorb","q":"In POSDCORB, which element involves decision-making about activities for the existence, survival, growth and progress of the organisation?","a":"Planning","d":["Organising","Directing","Co-ordinating"]},{"c":5,"g":"posdcorb","q":"In POSDCORB, which element is the delineation of activities, their grouping into units/departments, and delegation of authority?","a":"Organising","d":["Planning","Staffing","Co-ordinating"]},{"c":5,"g":"posdcorb","q":"In POSDCORB, which element is the task of recruiting, selecting, training and supporting key personnel?","a":"Staffing","d":["Organising","Directing","Reporting"]},{"c":5,"g":"posdcorb","q":"In POSDCORB, which element is the leader's capacity to organise, encourage and inspire staff to perform their functions?","a":"Directing","d":["Co-ordinating","Staffing","Reporting"]},{"c":5,"g":"posdcorb","q":"In POSDCORB, which element is the process of bringing related activities together to avoid chaos?","a":"Co-ordinating","d":["Organising","Directing","Planning"]},{"c":5,"g":"posdcorb","q":"In POSDCORB, which element is about sharing important and true information with those above and below in the hierarchy?","a":"Reporting","d":["Co-ordinating","Directing","Budgeting"]},{"c":5,"g":"posdcorb","q":"According to Keith (1991), what is budgeting?","a":"A financial plan that underlies an action, translating ideas and plans into a resource allocation that reflects an institution's priority","d":["A record of past expenditure","A forecast of income only","A statement of accounts for auditing"]},{"c":5,"g":"posdcorb","q":"What are the benefits of budgeting?","a":"Leaders are less likely to overspend, and money is better accounted for","d":["Reports are produced faster","Staff are more motivated","Auditing becomes unnecessary"]},{"c":5,"g":"tone","q":"What is the 'tone' of a school?","a":"The conditions under which teaching and learning take place — the prevailing atmosphere that influences teaching, learning and the moral training of pupils","d":["The reputation of a school in the community","The academic results of a school","The discipline record of a school"]},{"c":5,"g":"tone","q":"What does a GOOD tone do?","a":"Promotes effective teaching and learning","d":["Militates against effective teaching and learning","Increases enrolment","Reduces staff turnover"]},{"c":5,"g":"tone","q":"Which is a feature of a GOOD school tone?","a":"Open administration — delegation of duties and decentralisation of activities","d":["Closed administration to maintain authority","Centralised decision-making","Restricted flow of information"]},{"c":5,"g":"tone","q":"Which is a feature of a GOOD school tone?","a":"Free flow of information among the head, teachers and pupils, both vertical and horizontal","d":["Information passed only downward","Communication limited to circulars","Information restricted to senior staff"]},{"c":5,"g":"tone","q":"Through which channels does free flow of information occur in a school with a good tone?","a":"Durbars, school gatherings, notices on notice boards and circulars","d":["Staff meetings only","Circulars only","The head teacher's office only"]},{"c":5,"g":"tone","q":"A bad school tone is a sign of what?","a":"Closed administration","d":["Open administration","Democratic leadership","Delegated authority"]},{"c":5,"g":"tone","q":"What does closed administration create?","a":"Suspicion and rumour-mongering, which often create tension and unrest","d":["Efficiency and order","Clear lines of authority","Better academic results"]},{"c":5,"g":"tone","q":"Which discipline feature contributes to a good school tone?","a":"Preparing and submitting lesson notes for vetting at the right time","d":["Punishing latecomers publicly","Restricting pupil movement","Increasing homework"]},{"c":5,"g":"mgmt-tools","q":"What are management tools?","a":"Devices used by heads of schools to monitor and evaluate the performance of teaching and learning outcomes","d":["Records kept for auditing purposes","Equipment used in teaching","Documents required by the district office"]},{"c":5,"g":"mgmt-tools","q":"Which management tool monitors teachers' attendance and punctuality at school?","a":"The teacher's time book","d":["The movement book","The attendance register","The suggestion box"]},{"c":5,"g":"mgmt-tools","q":"Which management tool monitors teachers' movement OUTSIDE the school?","a":"The movement book","d":["The teacher's time book","The attendance register","The organogram"]},{"c":5,"g":"mgmt-tools","q":"Which management tool provides feedback and suggestions to help the school administration improve?","a":"The suggestion box","d":["The movement book","The attendance register","The subject allocation chart"]},{"c":5,"g":"mgmt-tools","q":"Which management tool monitors pupils' and students' attendance?","a":"The attendance register","d":["The teacher's time book","The movement book","The time table"]},{"c":5,"g":"mgmt-tools","q":"Which management tool ensures judicious and efficient utilisation of official contact hours?","a":"The time table","d":["The attendance register","The organogram","The movement book"]},{"c":5,"g":"mgmt-tools","q":"What information should the staff chart in a school indicate?","a":"Names, qualifications, ranks, teacher registration
