:"Large enrolment at the boarding house creating supervision challenges","d":["Reduced boarding demand","Fewer students per class","Regular release of funds"]},{"c":8,"g":"free-shs-comp","q":"Name the three main components of the Free SHS policy.","a":"Free tuition; free boarding fees; and absorbed fees","d":["Free tuition, free books and free uniforms","Free tuition, free meals and free transport","Free boarding, free feeding and free examination"]},{"c":8,"g":"free-shs-comp","q":"Which of these is an ABSORBED fee under Free SHS?","a":"Admission, library, computer lab, utilities, uniforms, examination, TLMs, sports and culture, science resource centre","d":["Pocket money and transport","Extra classes and holiday tuition","School uniform tailoring only"]},{"c":8,"g":"free-shs-comp","q":"What meal provision is made for DAY students under Free SHS?","a":"One HOT meal for the day, served in the schools","d":["Two meals a day","Breakfast only","A packed lunch to take home"]},{"c":8,"g":"deboarding","q":"Under which reforms does the deboardinisation policy fall?","a":"The 1987 New Education Reforms","d":["The 1974 Dzobo reforms","The 2007 reforms","The 2017 Free SHS policy"]},{"c":8,"g":"deboarding","q":"What does the deboardinisation policy demand?","a":"That all existing boarding institutions, particularly second cycle institutions, and any new schools opened, should be DAY institutions","d":["That all day schools become boarding schools","That boarding be reserved for deprived students","That boarding fees be abolished"]},{"c":8,"g":"deboarding","q":"Which is an ADVANTAGE of deboardinisation?","a":"Institutions can increase their intakes as there will be no dormitory space constraints","d":["Students from other regions gain access","National unity is promoted","Deprived pupils get better facilities"]},{"c":8,"g":"deboarding","q":"Which is an ADVANTAGE of deboardinisation?","a":"Student disturbances arising from the dining hall will be completely eliminated","d":["Boarding subsidies will increase","Peer pressure will increase","Parents will pay more"]},{"c":8,"g":"deboarding","q":"Which is an ADVANTAGE of deboardinisation for parents?","a":"Parents can supervise their wards' learning activities at home in the evening","d":["Parents pay lump sums each term","Parents travel further to visit","Parents have less contact with school"]},{"c":8,"g":"deboarding","q":"Which is a DISADVANTAGE of deboardinisation?","a":"It will not promote national unity, as the boarding system helps to integrate students from different ethnic groups","d":["It reduces school intake capacity","It increases dining hall disturbances","It raises boarding fees"]},{"c":8,"g":"deboarding","q":"Which is a DISADVANTAGE of deboardinisation for pupils from deprived areas?","a":"They will not have access to a favourable environment and basic facilities such as tables, chairs and lighting for study at home","d":["They will travel further to school","They will pay more fees","They will have fewer teachers"]},{"c":8,"g":"capitation","q":"What is capitation?","a":"An amount fixed at the same level for every pupil in the basic school","d":["A grant given to schools based on need","A fee paid by parents per term","A subsidy paid to teachers"]},{"c":8,"g":"capitation","q":"In which academic year was the capitation grant scheme introduced?","a":"2005/2006","d":["2004/2005","2006/2007","2003/2004"]},{"c":8,"g":"capitation","q":"Which body introduced the capitation grant scheme?","a":"The Ministry of Education","d":["The Ghana Education Service","The District Assemblies","The GET Fund"]},{"c":8,"g":"capitation","q":"What problem does the capitation grant scheme aim to remove?","a":"The payment of levies charged by many districts, which act as a financial barrier to access to basic education","d":["The cost of textbooks","The cost of school uniforms","The cost of school feeding"]},{"c":8,"g":"capitation","q":"How much does every public basic school receive per pupil enrolled per cher Award?","a":"All classroom teachers in primary, JSS, SSS, vocational and technical institutions and teacher training colleges, in both public AND private institutions","d":["Only public school teachers","Only basic school teachers","Only teachers with degrees"]},{"c":8,"g":"best-teacher","q":"Name the three criteria for selection for the Best Teacher Award.","a":"Professional competency; personality factor; and contribution to the community","d":["Qualification, experience and conduct","Attendance, output and discipline","Results, innovation and leadership"]},{"c":8,"g":"best-teacher","q":"Which selection criterion includes the teacher's moral, social, emotional and spiritual characteristics?","a":"Personality factor","d":["Professional competency","Contribution to the community","Innovativeness"]},{"c":8,"g":"best-teacher","q":"For how many years minimum must a teacher have taught to qualify for the award?","a":"Ten (10) years","d":["Five (5) years","Fifteen (15) years","Eight (8) years"]},{"c":8,"g":"best-teacher","q":"Which is another consideration for the Best Teacher Award?","a":"Be well informed about educational policies and issues as well as educational management and administration","d":["Hold a master's degree","Be a member of a teacher union","Have never been queried"]},{"c":8,"g":"best-teacher","q":"Who may select outstanding teachers to face the District or Regional Selection Committees?","a":"Circuit supervisors, heads of institutions, colleague teachers, pupils/students, the teachers themselves, or the community","d":["Only circuit supervisors","Only heads of institutions","Only the district director"]},{"c":8,"g":"best-teacher","q":"Which committee selects candidates for the National Selection Committee?","a":"The Regional Committees","d":["The District Committees","The circuit supervisors","The GES Council"]},{"c":8,"g":"best-teacher","q":"Which prizes are given in the Best Teacher Award Scheme?","a":"A house, a saloon car, foreign educational tes morality in a society?","a":"The cherished values and practices of that society — any deviation may constitute immorality","d":["The laws passed by Parliament","The teachings of religious bodies","The code of conduct of the profession"]},{"c":8,"g":"personality","q":"Through what means are honesty, tolerance, patience, punctuality and time management taught?","a":"Through games and sports, by observing the rules and regulations governing them","d":["Through RME lessons only","Through the school assembly","Through the code of conduct"]},{"c":8,"g":"personality","q":"Besides games and sports, what else teaches morality in schools?","a":"Literature in languages, storytelling, clubs and societies, school worship, and the code of conduct for second cycle institutions","d":["Only religious and moral education","Only school assemblies","Only the head teacher's addresses"]},{"c":8,"g":"individual-diff","q":"What are individual differences?","a":"Characteristic patterns of thinking, feeling and behaviour","d":["Differences in academic ability only","Differences in family background only","Differences in age and gender"]},{"c":8,"g":"individual-diff","q":"Which two main factors account for individual differences?","a":"Innate potential, and environment (attitude to the child, peer influence, family background, and general conditions in the community)","d":["Genetics and nutrition","Teaching and assessment","Family income and location"]},{"c":8,"g":"individual-diff","q":"How should teachers respond to individual differences?","a":"Treat each child as unique to enable him to develop his potential, and vary teaching methods to take care of both slow and fast learners","d":["Teach all children in the same way","Group children by ability permanently","Focus on the average learner"]},{"c":8,"g":"individual-diff","q":"The concept of individual differences in talents and interests is the basis for what?","a":"Planning and selection of elective subjects at Senior High School level isition","d":["By the age of first words","By sentence length","By pronunciation accuracy"]},{"c":8,"g":"socialisation","q":"What is education?","a":"The process of receiving or giving systematic instruction, especially at school, to enable a child/pupil/student acquire a body of knowledge or specific skills","d":["The process of acquiring the culture of a society","The results of school activities","The transmission of societal values"]},{"c":8,"g":"socialisation","q":"What is socialisation?","a":"The continuing process of acquiring the culture of a particular society — the norms, values, behaviours and social skills appropriate to one's position — so as to become a full member of the society","d":["The process of receiving systematic instruction at school","The benefits society receives when an individual is educated","The interaction between school and community"]},{"c":8,"g":"socialisation","q":"What is the 'externality' of education?","a":"The benefits that society receives and enjoys when an individual is educated","d":["The costs society bears for education","The influence of outside agencies on schools","The impact of the school on the community"]},{"c":8,"g":"outcomes","q":"What are education outcomes?","a":"Results that come out of school activities such as teaching and learning in the classroom, co-curricular activities and general personality development","d":["The results of examinations only","The number of graduates produced","The performance of teachers"]},{"c":8,"g":"outcomes","q":"Which is an example of an education outcome?","a":"Academic excellence — high quality grades for further studies","d":["Increased enrolment","Improved infrastructure","Better teacher attendance"]},{"c":8,"g":"outcomes","q":"Which is an example of an education outcome learned from co-curricular activities and observance of the code of conduct?","a":"Moral uprightness — tolerance, honesty, etc.","d":["Academic excellence","Readiness for the job market","Career development"] ctor Reform"]},{"c":9,"g":"psc-membership","q":"On what basis do the NCTE chairman and the three experienced persons hold office on the PSC?","a":"On a PART-TIME basis only, for such period as specified in their letters of appointment","d":["On a full-time basis for three years","On a part-time basis for five years","On a full-time basis, renewable"]},{"c":9,"g":"fiscal","q":"What is fiscal policy?","a":"The use of government revenue collection (taxation) and expenditure (spending) to influence macroeconomic conditions in the country","d":["The process by which the monetary authority controls the supply of money","The regulation of banks and credit systems","The management of foreign exchange rates"]},{"c":9,"g":"fiscal","q":"Which ministry controls fiscal policy?","a":"The Ministry of Finance and Economic Planning","d":["The Bank of Ghana","The Ministry of Trade","The Ghana Revenue Authority"]},{"c":9,"g":"fiscal","q":"Which is an objective of fiscal policy?","a":"To improve unemployment rates and control inflation","d":["To set the exchange rate","To issue currency notes and coins","To regulate commercial banks"]},{"c":9,"g":"fiscal","q":"Which is an objective of fiscal policy?","a":"To stabilise the business cycle and influence the interest cycle","d":["To supervise non-banking financial institutions","To collect taxes for government","To serve as banker to the government"]},{"c":9,"g":"monetary","q":"What is monetary policy?","a":"The process by which the monetary authority of a country controls the supply of money, often targeting a rate of interest, to promote economic growth and stability","d":["The use of taxation and spending to influence the economy","The regulation of the national budget","The management of government revenue"]},{"c":9,"g":"monetary","q":"What are the official goals of monetary policy?","a":"Relatively stable prices and low unemployment","d":["Increased government revenue and reduced spending","Higher exchange rates and lower imports","In ernment agencies?","a":"The Controller and Accountant-General's Department","d":["The Ghana Revenue Authority","The Bank of Ghana","The Ministry of Finance"]},{"c":9,"g":"econ-agencies","q":"Which department collects and manages data for government decision-making?","a":"The Statistical Service Department","d":["The Controller and Accountant-General's Department","The Ghana Revenue Authority","The Bank of Ghana"]},{"c":9,"g":"econ-agencies","q":"Which ministry is in charge of labour-related issues?","a":"The Ministry of Employment and Labour Relations","d":["The Ministry of Finance and Economic Planning","The Ministry of Local Government","The Public Services Commission"]},{"c":9,"g":"ncce","q":"Under which Act was the National Commission on Civic Education established?","a":"Act 452 of 1992","d":["Act 482 of 1994","Act 462 of 1993","Act 456 of 1993"]},{"c":9,"g":"ncce","q":"Which is a function of the NCCE?","a":"To educate the Ghanaian public on the principles and objectives of the 1992 Constitution as the fundamental law of the people of Ghana","d":["To investigate human rights abuses","To advise on public appointments","To supervise elections"]},{"c":9,"g":"ncce","q":"Which is a function of the NCCE?","a":"To educate and encourage the public to defend the Constitution at all times against all forms of abuse and violation","d":["To prosecute constitutional offenders","To amend the Constitution","To interpret the Constitution"]},{"c":9,"g":"ncce","q":"Which is a function of the NCCE regarding elections?","a":"To educate people on their civic responsibilities and their right and obligation to vote and choose their leaders at elections","d":["To organise and conduct elections","To register voters","To declare election results"]},{"c":9,"g":"chraj","q":"What does 'CHRAJ' stand for?","a":"The Commission on Human Rights and Administrative Justice","d":["The Committee on Human Rights and Access to Justice","The Council for Human Rights and Administrative Justice","The Commission for Human Rights and Anti-corruption Justice"]},{"c":9,"g":"chraj","q":"Which document gave CHRAJ its broad mandate?","a":"The 1992 Constitution","d":["Act 452 of 1994","Act 456 of 1993","The 1979 Constitution"]},{"c":9,"g":"chraj","q":"What is CHRAJ's THREEFOLD mandate?","a":"A National Human Rights Institution; an Ombudsman (ensuring administrative justice); and an anti-corruption agency for the public sector","d":["Human rights, elections and civic education","Human rights, labour relations and public appointments","Investigation, prosecution and adjudication"]},{"c":9,"g":"chraj","q":"Which international standards recommend that National Human Rights Institutions in developing countries be given a broad mandate?","a":"The Paris Principles","d":["The Geneva Conventions","The Vienna Declaration","The Commonwealth Charter"]},{"c":9,"g":"chraj","q":"Why was CHRAJ given a broad and inclusive mandate?","a":"So it can use limited resources to greatest effect, and because administrative injustice and corruption often occur alongside human rights abuses","d":["To reduce the number of state institutions","To satisfy donor requirements","To replace the courts"]},{"c":9,"g":"chraj-func","q":"Which is a function of CHRAJ?","a":"To investigate complaints of violations of fundamental rights and freedoms, injustice, corruption, abuse of power and unfair treatment by a public officer","d":["To prosecute all criminal offences","To conduct national elections","To license public officers"]},{"c":9,"g":"chraj-func","q":"Which is a function of CHRAJ regarding corruption?","a":"To investigate all instances of alleged or suspected corruption and misappropriation of public monies by officials, and report to the Attorney-General and Auditor-General","d":["To prosecute corrupt officials directly","To dismiss corrupt officials","To recover stolen funds"]},{"c":9,"g":"chraj-func","q":"To whom does CHRAJ report annually on the performance of its functions?","a":"Parliament","d":["Th ","The Attorney-General's Department"]},{"c":9,"g":"human-rights","q":"Can fundamental human rights be taken away?","a":"They cannot be taken away or infringed upon by any individual, group or government WITHOUT THE DUE PROCESS OF THE LAW","d":["They can never be limited in any way","They may be removed by government at any time","They apply only to citizens"]},{"c":9,"g":"human-rights","q":"Which is a fundamental human right listed in the handbook?","a":"The right to belong to any association, provided it does not engage in anti-social activities","d":["The right to free housing","The right to guaranteed employment","The right to unlimited free healthcare"]},{"c":9,"g":"human-rights","q":"Which right relates to expressing one's views?","a":"The right to express one's views on issues WITHOUT ATTACKING PERSONALITIES","d":["The right to say anything about anyone","The right to publish without restriction","The right to remain silent"]},{"c":9,"g":"human-rights","q":"'Exercising one's franchise' as a human right means what?","a":"The right to vote","d":["The right to own property","The right to free movement","The right to hold public office"]},{"c":9,"g":"rights-education","q":"Which is a human right in education?","a":"The right to attend any school, be it public or mission-affiliated","d":["The right to free tertiary education","The right to be admitted without qualification","The right to choose one's teachers"]},{"c":9,"g":"rights-education","q":"Which is a human right in education?","a":"The right to pursue any programme of one's choice, and to study to any level","d":["The right to change schools at will","The right to set one's own examinations","The right to a guaranteed pass"]},{"c":9,"g":"rights-education","q":"Which is a human right in education relating to boarding?","a":"The right to boarding status","d":["The right to free transport","The right to free meals","The right to a private room"]},{"c":9,"g":"rights-education","q":"What limits apply to all rights within education?","a":"One has to satisfy the laid-down requirements","d":["Rights apply only to public schools","Rights apply only to citizens","Rights apply only up to basic level"]},{"c":9,"g":"child-rights","q":"Which is a right of every child?","a":"The right to protection and affection","d":["The right to employment","The right to vote","The right to own land"]},{"c":9,"g":"child-rights","q":"Name the six rights of a child listed in the handbook.","a":"To live; food; clothing and shelter; protection and affection; good health; and education","d":["To live, education, healthcare, play, family and protection","To food, shelter, clothing, education, health and justice","To live, health, education, property, religion and association"]},{"c":9,"g":"child-abuse","q":"What is child abuse?","a":"Cruel, severe or unjust handling or use of a child less than 16 years of age by an adult — simply put, denying a child of his or her rights","d":["Any punishment of a child by a parent","Failure to send a child to school","Employment of a child under 18"]},{"c":9,"g":"child-abuse","q":"According to UNICEF, where is the problem of child abuse WORST?","a":"In Asia — especially Thailand, India and the Philippines — and in Africa","d":["In Europe and North America","In South America","In the Middle East"]},{"c":9,"g":"child-abuse","q":"What is 'defilement'?","a":"Sexual activity with a girl-child, mostly girls under 16 who serve as housemaids or step-daughters","d":["Sexual activity with one's own daughter","Trading in children for sexual purposes","Using children in pornographic films"]},{"c":9,"g":"child-abuse","q":"What is 'child labour'?","a":"A situation where children under 18 are made to undertake economic activities to supplement the domestic budget","d":["Children helping with household chores","Children working during school holidays","Children learning a trade through apprenticeship"]},{"c":9,"g":"child-abuse","q":"Which activities are cited as child labour?","a":"H onsent"]},{"c":9,"g":"child-abuse","q":"What is 'child trafficking'?","a":"Unlawfully trading in children under 18 years for domestic and sexual purposes — also termed child slavery","d":["Sending children to work abroad","Selling goods using children","Transporting children between regions"]},{"c":9,"g":"child-abuse","q":"What is 'incest'?","a":"Sexual activity with one's own girl-child (daughter)","d":["Sexual activity with any girl under 16","Sexual activity with a step-daughter","Sexual activity with a housemaid"]},{"c":9,"g":"child-abuse","q":"What is 'abduction' as a form of child abuse in Ghana?","a":"Girl-children sent to serve at shrines (the Trokosi system)","d":["Kidnapping children for ransom","Taking children across borders","Removing children from school"]},{"c":9,"g":"child-abuse","q":"Which is an EFFECT of child abuse?","a":"The abused child is unable to develop his or her total personality, becomes an outcast, and is depressed","d":["The child becomes more independent","The child performs better in school","The child develops resilience"]},{"c":9,"g":"child-abuse","q":"Which is an EFFECT of child abuse relating to disease?","a":"Spread of AIDS and other sexually transmitted diseases as a result of defilement and child prostitution","d":["Increased malnutrition only","Higher rates of malaria","Increased physical injury only"]},{"c":9,"g":"child-abuse","q":"Which is an EFFECT of child prostitution and pornography in adulthood?","a":"It may lead to barrenness when they become adults","d":["It leads to early marriage","It leads to unemployment","It leads to illiteracy"]},{"c":9,"g":"child-abuse-remedy","q":"Which bodies are cited as helping educate parents on the dangers of child abuse?","a":"Ghana National Commission on Children, Department of Social Welfare, NGOs, the 31st December Women's Movement, National Council on Women and Development, Federation of Women Lawyers, and UNICEF","d":["The GES and the Ministry of Education","CHRAJ and the NCCE","The Police Service and the Judiciary"]},{"c":9,"g":"child-abuse-remedy","q":"Which organisation has been organising international conferences on child labour and defilement?","a":"UNICEF (United Nations International Children's Fund)","d":["UNESCO","UNDP","The World Bank"]},{"c":9,"g":"sspp","q":"What is the AIM of the Single Spine Pay Policy?","a":"To attract, retain and motivate public service workers to enhance effectiveness in service delivery and improve productivity","d":["To reduce the government wage bill","To standardise working hours","To harmonise conditions of service"]},{"c":9,"g":"sspp","q":"Which is an OBJECTIVE of the Single Spine Pay Policy?","a":"To promote equity in the administration of public service pay","d":["To reduce the number of public servants","To increase tax revenue","To decentralise pay administration"]},{"c":9,"g":"sspp","q":"Which is an OBJECTIVE of the Single Spine Pay Policy?","a":"To establish principles for matching wage increases to productivity","d":["To freeze salaries at current levels","To pay all workers equally","To remove allowances"]},{"c":9,"g":"sspp","q":"Which SSPP objective concerns the private sector?","a":"To improve the public service's ability to compete with the private sector in attracting and retaining key staff","d":["To privatise the public service","To match private sector working hours","To reduce private sector influence"]},{"c":9,"g":"aims-goals","q":"What are EDUCATIONAL AIMS?","a":"A purpose stated at the HIGHEST LEVEL OF GENERALITY, which reminds us of our ideals and directs the construction of goals and objectives","d":["Statements that give direction for overall planning","Specific intentions delineating outcomes","The end results of learning experiences"]},{"c":9,"g":"aims-goals","q":"'Ghana as a nation could aim at creating a computer literate society' is an example of what?","a":"An educational AIM","d":["An educational goal","An educational objective","An educational outcome"]},{"c":9,"g":"aims-goals","q":"What are EDUCATIONAL GOALS?","a":"More definite than aims — stated in a way that gives direction and purpose for the overall planning and execution of education, documenting content in syllabuses and textbooks","d":["Purposes stated at the highest level of generality","Specific intentions taking a short time to achieve","The end results of learning experiences"]},{"c":9,"g":"aims-goals","q":"What are EDUCATIONAL OBJECTIVES?","a":"Usually specific educational intentions which delineate general or specific outcomes, taking a relatively SHORTER time to achieve than goals and aims","d":["Purposes stated at the highest level of generality","Statements documenting content in syllabuses","The products of learning experiences"]},{"c":9,"g":"aims-goals","q":"Translating what has been documented in textbooks or the syllabus into TEACHABLE UNITS is an example of what?","a":"An educational objective","d":["An educational aim","An educational goal","An educational outcome"]},{"c":9,"g":"aims-goals","q":"What are EDUCATION OUTCOMES?","a":"The PRODUCTS of learning experiences — the end results of learning, e.g. knowledge, understanding, application, thinking skills, general skills and attitudes","d":["The goals set for a programme","The purposes stated at the highest generality","The specific intentions of a lesson"]},{"c":9,"g":"aims-goals","q":"Rank aims, goals and objectives by the TIME they take to achieve, longest first.","a":"Aims (longest), then goals, then objectives (shortest)","d":["Objectives, then goals, then aims","Goals, then aims, then objectives","They all take the same time"]},{"c":10,"g":"mcq-tips","q":"What is tip 1 for multiple choice tests?","a":"Read the ENTIRE question before glancing over the answer options","d":["Read the options first, then the question","Answer the easiest questions first","Eliminate wrong answers immediately"]},{"c":10,"g":"mcq-tips","q":"Why is jumping to the most logical answer before reading the whole question a mistake?","a":"Because teachers often think they know what a question is asking before reading it, and this can cost dearly on multiple choice exams","d":["Because it wastes time","Because the first option is never correct","Because examiners penalise fast answers"]},{"c":10,"g":"mcq-tips","q":"What is tip 2 for multiple choice tests?","a":"Answer the question in your MIND before reviewing the answer options","d":["Eliminate wrong answers first","Skip difficult questions","Read the options twice"]},{"c":10,"g":"mcq-tips","q":"Why should you answer a question in your mind before looking at the options?","a":"It helps prevent you from talking yourself OUT of the correct answer","d":["It saves time","It reduces anxiety","It improves memory"]},{"c":10,"g":"mcq-tips","q":"What is tip 3 for multiple choice tests?","a":"Eliminate answer options you are 100% sure are incorrect before selecting the answer you believe is correct","d":["Guess randomly among all options","Choose the longest option","Choose option C by default"]},{"c":10,"g":"mcq-tips","q":"Why eliminate wrong answers even when you know the right one immediately?","a":"It ensures your answer choice is the correct one","d":["It is required by the examiners","It earns extra marks","It saves time"]},{"c":10,"g":"mcq-tips","q":"What is tip 4 for multiple choice tests?","a":"Don't waste time on questions you don't seem to have an idea about immediately","d":["Spend as long as needed on each question","Answer questions strictly in order","Leave the hardest until you have solved them"]},{"c":10,"g":"mcq-tips","q":"What is the recommended FIRST-ATTEMPT strategy?","a":"Answer about 50% of the questions at your first attempt — the ones you know at a glance — and be very sure of scoring ALL of them","d":["Answer 25% at first attempt","Answer all questions in order","Answer only the last 50%"]},{"c":10,"g":"mcq-tips","q":"What should you do with the remaining 50% of questions?","a":"Take your time to read and analyse them, and ensure you answer up to 50% of them — these are the ones you need to think about","d":["Guess them all randomly","Leave them blank","Answer them first"]},{"c":10,"g":"mcq-tips","q":"What should you do with the final set of questions you have left?","a":"Choose the answers RANDOMLY — these are questions you have no idea about and can't do anything about regardless of time","d":["Leave them blank","Choose the same letter for all","Spend the remaining time on them"]},{"c":10,"g":"mcq-tips","q":"What is tip 8 for multiple choice tests?","a":"Select the BEST answer","d":["Select the first correct answer","Select the longest answer","Select the most technical answer"]},{"c":10,"g":"mcq-tips","q":"Why do AD II and above questions often seem to have all options correct?","a":"Because these are management positions requiring decision-making, so questions test decision-making ability — there is a BEST option out of the lot","d":["Because the questions are badly written","Because examiners want to confuse candidates","Because all options are equally valid"]},{"c":10,"g":"mcq-tips","q":"From which rank upwards are positions described as management positions requiring decision-making?","a":"AD II (Assistant Director II) and above","d":["Principal Superintendent and above","Deputy Director and above","Senior Superintendent I and above"]}];
const CHAPTERS = {"1": "GES & MOE", "2": "Acts, Laws & Reforms", "3": "Learning Theories", "4": "Classroom Management", "5": "Leadership & Administration", "6": "Assessment & Evaluation", "7": "Curriculum", "8": "Contemporary Issues", "9": "Public Administration", "10": "Exam Strategy"};

/* ---------- storage ---------- */
const KEY = "ges-markingbook-v1";
let S = {box:{}, wrong:{}, star:{}, due:{}, seen:0, right:0, chapters:null, mode:"quiz"};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

/* Leitner intervals in days, box 1..5 */
const IVL = [0, 1, 2, 4, 8, 16];
const today = () => Math.floor(Date.now()/864e5);

/* ---------- variant labelling for repeated stems ---------- */
(function(){
  const counts = {};
  CARDS.forEach(c => counts[c.q] = (counts[c.q]||0)+1);
  const seen = {};
  CARDS.forEach((c,i) => {
    c.id = i;
    if(counts[c.q] > 1){ seen[c.q] = (seen[c.q]||0)+1; c.v = seen[c.q]+"/"+counts[c.q]; }
  });
})();

/* ---------- state ---------- */
let mode = S.mode || "quiz";
let chapSel = S.chapters ? new Set(S.chapters) : new Set(Object.keys(CHAPTERS).map(Number));
let filters = {due:false, star:false, leech:false};
let queue = [], idx = 0, answered = false, flipped = false;
let session = {right:0, wrong:0, total:0};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const isTouch = matchMedia("(hover:none)").matches;
const toTop = () => { try{ if(window.scrollY > 0) window.scrollTo(0,0); }catch(e){} };
/* one gesture/keystroke to move the card on: reveals, grades, or advances */
function advance(){
  if(mode === "quiz"){ if(answered) next(); }
  else if(mode === "flip"){ if(!flipped){ flipped = true; renderFlip(); } }
}
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const boxOf = c => S.box[c.id] || 0;
const isLeech = c => (S.wrong[c.id]||0) >= 3;
const isDue = c => { const d = S.due[c.id]; return d === undefined || d <= today(); };

function pool(){
  return CARDS.filter(c => {
    if(!chapSel.has(c.c)) return false;
    if(filters.star && !S.star[c.id]) return false;
    if(filters.leech && !isLeech(c)) return false;
    if(filters.due && !isDue(c)) return false;
    return true;
  });
}

function buildQueue(){
  const p = pool();
  /* weakest first: unseen and low-box cards lead, then shuffle within tier */
  const tiers = [[],[],[],[],[],[]];
  p.forEach(c => tiers[boxOf(c)].push(c));
  queue = [];
  tiers.forEach(t => queue.push(...shuffle(t)));
  /* leeches jump the line */
  queue.sort((a,b) => (isLeech(b)?1:0) - (isLeech(a)?1:0));
  idx = 0; answered = false; flipped = false;
  session = {right:0, wrong:0, total:queue.length};
}

/* ---------- grading ---------- */
function grade(card, correct){
  const b = boxOf(card);
  const nb = correct ? Math.min(5, b+1) : 1;
  S.box[card.id] = nb;
  S.due[card.id] = today() + IVL[nb];
  if(!correct) S.wrong[card.id] = (S.wrong[card.id]||0)+1;
  S.seen++; if(correct) S.right++;
  correct ? session.right++ : session.wrong++;
  save();
}

/* ---------- rendering ---------- */
function renderRail(){
  const boxes = [0,0,0,0,0,0];
  CARDS.forEach(c => boxes[boxOf(c)]++);
  const labels = ["New","Box 1","Box 2","Box 3","Box 4","Learned"];
  $("#railboxes").innerHTML = boxes.map((n,i) =>
    `<div class="boxcell b${i}"><b>${n}</b><span>${labels[i]}</span></div>`).join("");

  $("#chaplist").innerHTML = Object.entries(CHAPTERS).map(([n,name]) => {
    const cs = CARDS.filter(c => c.c === +n);
    const learned = cs.filter(c => boxOf(c) >= 4).length;
    const pct = cs.length ? Math.round(learned/cs.length*100) : 0;
    return `<button class="chap" data-ch="${n}" aria-pressed="${chapSel.has(+n)}">
      <span class="n">${String(n).padStart(2,"0")}</span>
      <span>${name}</span>
      <span class="ct">${cs.length}</span>
      <span class="chapbar"><i style="width:${pct}%"></i></span>
    </button>`;
  }).join("");
  $("#chaplist").querySelectorAll(".chap").forEach(b => b.onclick = () => {
    const n = +b.dataset.ch;
    chapSel.has(n) ? chapSel.delete(n) : chapSel.add(n);
    if(!chapSel.size) chapSel.add(n);
    S.chapters = [...chapSel]; save();
    renderRail(); restart();
  });
}

function renderTally(){
  $("#tRight").textContent = session.right;
  $("#tWrong").textContent = session.wrong;
  $("#tLeft").textContent = Math.max(0, queue.length - idx);
  const done = queue.length ? idx/queue.length*100 : 0;
  $("#progbar").style.width = done + "%";
}

const esc = s => String(s).replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));

function cardHead(card){
  return `<div class="cardhead">
    <span class="tag">Ch ${card.c} &middot; ${esc(CHAPTERS[card.c])}</span>
    ${card.v ? `<span class="tag box">answer ${card.v}</span>` : ""}
    ${isLeech(card) ? `<span class="tag plain">missed ${S.wrong[card.id]}&times;</span>` : ""}
    <span class="tag plain">${["New","Box 1","Box 2","Box 3","Box 4","Learned"][boxOf(card)]}</span>
    <button class="star" id="starbtn" aria-pressed="${!!S.star[card.id]}" title="Star this card (S)">${S.star[card.id] ? "&#9733;" : "&#9734;"}</button>
  </div>`;
}

const TICK = `<svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.2 L9.4 18.4 L20 5.8"/></svg>`;
const CROSS = `<svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>`;

function renderQuiz(){
  const card = queue[idx];
  if(!card) return renderDone();
  if(!card._opts){
    card._opts = shuffle([card.a, ...card.d]);
  }
  const opts = card._opts;
  $("#stage").innerHTML = `
    <div class="card">
      ${cardHead(card)}
      <div class="q">${esc(card.q)}</div>
      <div class="opts" id="opts">
        ${opts.map((o,i) => `<button class="opt" data-i="${i}">
          <span class="gutter"><span class="key">${i+1}</span>${TICK}${CROSS}</span>
          <span class="txt">${esc(o)}</span>
        </button>`).join("")}
      </div>
    </div>
    <div class="actions" id="afterbar"></div>
    <div class="hint">Press <b>1</b>&ndash;<b>4</b> to answer &middot; <b>Space</b> for next &middot; <b>S</b> to star</div>`;
  answered = false;
  toTop();
  $("#opts").querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.i));
  wireStar(card);
  renderTally();
}

function pick(i){
  if(answered) return;
  answered = true;
  const card = queue[idx];
  const opts = card._opts;
  const correct = opts[i] === card.a;
  grade(card, correct);
  $("#opts").querySelectorAll(".opt").forEach((b,j) => {
    b.disabled = true;
    const isAns = opts[j] === card.a;
    /* keep both marks in DOM but only show the relevant one */
    const marks = b.querySelectorAll(".mark");
    if(isAns){ b.classList.add("is-right"); marks[1].remove(); }
    else if(j === i){ b.classList.add("is-wrong"); marks[0].remove(); }
    else { b.classList.add("is-muted"); marks[0].remove(); marks[1].remove(); }
  });
  const bar = $("#afterbar");
  bar.className = "actions pinned";
  bar.innerHTML = `<button class="btn btn-primary grow" id="nextbtn">Next <kbd>space</kbd></button>`;
  $("#nextbtn").onclick = next;
  if(!isTouch) $("#nextbtn").focus();
  renderRail(); renderTally();
}

function renderFlip(){
  const card = queue[idx];
  if(!card) return renderDone();
  $("#stage").innerHTML = `
    <div class="card">
      ${cardHead(card)}
      <div class="q">${esc(card.q)}</div>
      ${flipped ? `<div class="answer"><div class="eyebrow">Answer</div><p>${esc(card.a)}</p></div>` : ""}
    </div>
    <div class="actions pinned">${
      flipped
      ? `<button class="btn btn-again grow" id="againbtn">Missed it <kbd>1</kbd></button>
         <button class="btn btn-good grow" id="gotbtn">Got it <kbd>2</kbd></button>`
      : `<button class="btn btn-primary grow" id="showbtn">Show answer <kbd>space</kbd></button>`
    }</div>
    <div class="hint">Grade yourself honestly &mdash; the box schedule depends on it.</div>`;
  if(flipped){
    $("#againbtn").onclick = () => { grade(card,false); renderRail(); next(); };
    $("#gotbtn").onclick   = () => { grade(card,true);  renderRail(); next(); };
    if(!isTouch) $("#gotbtn").focus();
  } else {
    $("#showbtn").onclick = () => { flipped = true; renderFlip(); };
    if(!isTouch) $("#showbtn").focus();
    toTop();
  }
  wireStar(card);
  renderTally();
}

function wireStar(card){
  const b = $("#starbtn");
  if(!b) return;
  b.onclick = () => {
    S.star[card.id] ? delete S.star[card.id] : S.star[card.id] = 1;
    save(); b.setAttribute("aria-pressed", !!S.star[card.id]); b.innerHTML = S.star[card.id] ? "&#9733;" : "&#9734;";
  };
}

function next(){
  idx++; answered = false; flipped = false;
  (mode === "quiz" ? renderQuiz : renderFlip)();
}

function renderDone(){
  const total = session.right + session.wrong;
  const pct = total ? Math.round(session.right/total*100) : 0;
  const verdict = pct >= 85 ? "Exam-ready on this selection. Widen the filter or add chapters."
    : pct >= 65 ? "Solid. Run the Trouble filter to clean up what keeps slipping."
    : total === 0 ? "Nothing matched that filter. Loosen it and start again."
    : "Worth another pass. Missed cards drop back to Box 1 and return sooner.";
  $("#stage").innerHTML = `
    <div class="panel done">
      <div class="score mono">${total ? pct + "%" : "&mdash;"}</div>
      <h2>${total ? session.right + " of " + total + " right" : "Empty deck"}</h2>
      <p>${verdict}</p>
      <div class="actions" style="justify-content:center">
        <button class="btn btn-primary" id="againall">Start another round</button>
        <button class="btn" id="troublebtn">Drill trouble cards</button>
      </div>
    </div>`;
  $("#againall").onclick = restart;
  $("#troublebtn").onclick = () => {
    filters = {due:false, star:false, leech:true};
    syncFilterChips(); restart();
  };
  renderTally();
}

function renderStats(){
  const boxes = [0,0,0,0,0,0];
  CARDS.forEach(c => boxes[boxOf(c)]++);
  const labels = ["New","Box 1","Box 2","Box 3","Box 4","Learned"];
  const due = CARDS.filter(c => S.box[c.id] && isDue(c)).length;
  const leeches = CARDS.filter(isLeech).length;
  const starred = Object.keys(S.star).length;
  const acc = S.seen ? Math.round(S.right/S.seen*100) : 0;

  const rows = Object.entries(CHAPTERS).map(([n,name]) => {
    const cs = CARDS.filter(c => c.c === +n);
    const learned = cs.filter(c => boxOf(c) >= 4).length;
    const learning = cs.filter(c => { const b = boxOf(c); return b >= 1 && b <= 3; }).length;
    const pct = Math.round(learned/cs.length*100);
    return `<div class="mrow">
      <span class="lbl"><b>${String(n).padStart(2,"0")} &nbsp;${name}</b><i>${cs.length} cards</i></span>
      <span class="pct">${pct}%</span>
      <span class="track"><i class="learned" style="width:${learned/cs.length*100}%"></i><i class="learning" style="width:${learning/cs.length*100}%"></i></span>
    </div>`;
  }).join("");

  $("#stage").innerHTML = `
    <div class="panel">
      <div class="eyebrow">Deck state</div>
      <h2>${CARDS.length} cards, five boxes</h2>
      <p class="sub">A card climbs a box each time you get it right and falls to Box 1 when you miss it. Box 5 comes back every 16 days.</p>
      <div class="boxgrid">
        ${boxes.map((n,i) => `<div class="boxcell b${i}"><b>${n}</b><span>${labels[i]}</span></div>`).join("")}
      </div>
      <div class="boxgrid" style="margin-top:8px">
        <div class="boxcell"><b>${due}</b><span>Due now</span></div>
        <div class="boxcell"><b>${acc}%</b><span>Lifetime</span></div>
        <div class="boxcell"><b>${leeches}</b><span>Trouble</span></div>
        <div class="boxcell"><b>${starred}</b><span>Starred</span></div>
      </div>
    </div>
    <div class="panel">
      <div class="eyebrow">By chapter</div>
      <h2>Where you stand</h2>
      <p class="sub">Green is learned (Box 4 or 5). Gold is in progress.</p>
      <div class="masterlist">${rows}</div>
    </div>`;
  renderTally();
}

/* ---------- controls ---------- */
function setMode(m){
  mode = m; S.mode = m; save();
  ["quiz","flip","stats"].forEach(k => $("#m-"+k).setAttribute("aria-pressed", k===m));
  if(m === "stats") return renderStats();
  render();
}
function render(){
  if(mode === "stats") return renderStats();
  if(!queue.length) buildQueue();
  (mode === "quiz" ? renderQuiz : renderFlip)();
}
function restart(){
  CARDS.forEach(c => delete c._opts);
  buildQueue();
  if(mode === "stats") setMode("quiz"); else render();
}
function syncFilterChips(){
  $("#f-due").setAttribute("aria-pressed", filters.due);
  $("#f-star").setAttribute("aria-pressed", filters.star);
  $("#f-leech").setAttribute("aria-pressed", filters.leech);
}

$("#m-quiz").onclick  = () => setMode("quiz");
$("#m-flip").onclick  = () => setMode("flip");
$("#m-stats").onclick = () => setMode("stats");
["due","star","leech"].forEach(k => $("#f-"+k).onclick = () => { filters[k] = !filters[k]; syncFilterChips(); restart(); });
$("#selall").onclick  = () => { chapSel = new Set(Object.keys(CHAPTERS).map(Number)); S.chapters=[...chapSel]; save(); renderRail(); restart(); };
$("#selnone").onclick = () => { chapSel = new Set([1]); S.chapters=[...chapSel]; save(); renderRail(); restart(); };
$("#resetbtn").onclick = () => {
  if(!confirm("Clear all boxes, stars and history? This cannot be undone.")) return;
  S = {box:{}, wrong:{}, star:{}, due:{}, seen:0, right:0, chapters:[...chapSel], mode};
  save(); renderRail(); restart();
};
$("#themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
};
$("#railtoggle").onclick = () => document.body.classList.toggle("rail-open");
$("#scrim").onclick = () => document.body.classList.remove("rail-open");

document.addEventListener("keydown", e => {
  if(e.target.matches("input,textarea")) return;
  const k = e.key.toLowerCase();
  if(k === "s"){ const b = $("#starbtn"); if(b){ e.preventDefault(); b.click(); } return; }
  if(mode === "quiz"){
    if(!answered && /^[1-4]$/.test(k)){ e.preventDefault(); pick(+k - 1); return; }
    if((k === " " || k === "enter") && answered){ e.preventDefault(); next(); }
  } else if(mode === "flip"){
    if(k === " " || k === "enter"){ e.preventDefault(); advance(); return; }
    if(flipped && k === "1"){ e.preventDefault(); $("#againbtn").click(); }
    if(flipped && k === "2"){ e.preventDefault(); $("#gotbtn").click(); }
  }
});

/* ---------- swipe: left advances the card ---------- */
(function(){
  const el = $("#stage");
  let x0=0, y0=0, t0=0, live=false;
  el.addEventListener("touchstart", e => {
    if(e.touches.length !== 1) return live = false;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); live = true;
  }, {passive:true});
  el.addEventListener("touchend", e => {
    if(!live) return; live = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if(Date.now() - t0 > 600) return;
    if(Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    if(dx < 0) advance();
  }, {passive:true});
})();

/* ---------- go ---------- */
try {
  if(!Array.isArray(CARDS) || CARDS.length < 1235)
    throw new Error("Only " + (CARDS && CARDS.length) + " of 1235 cards arrived - the file is incomplete.");
  syncFilterChips();
  renderRail();
  buildQueue();
  setMode(mode);
  window.__mb.ok = true;
} catch(err) {
  __mbFail(err && err.message ? err.message : String(err));
}
</script>
</body>
</html>
