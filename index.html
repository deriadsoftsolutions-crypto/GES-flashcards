<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="1,235 multiple-choice flashcards covering all ten chapters of the GES Promotion Handbook.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marking Book">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23F3F4EF'/%3E%3Cpath d='M8 5v22' stroke='%23BE4430' stroke-width='1.5' opacity='.5'/%3E%3Cpath d='M12 17.5l4.5 4.5L26 9' fill='none' stroke='%232E7D5B' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>The Marking Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============ TOKENS ============ */
:root{
  --paper:#F3F4EF;
  --paper-2:#EAECE3;
  --card:#FFFFFF;
  --ink:#171B18;
  --ink-2:#4A5450;
  --ink-3:#7C8781;
  --rule:#D6DACE;
  --rule-soft:#E4E7DE;
  --gold:#9A6E14;
  --gold-bright:#C08F22;
  --gold-wash:#F6EBCF;
  --green:#2E7D5B;
  --green-wash:#DFF0E6;
  --red:#BE4430;
  --red-wash:#F8E2DC;
  --shadow:0 1px 2px rgba(23,27,24,.05),0 8px 26px -14px rgba(23,27,24,.28);
  --shadow-lift:0 2px 4px rgba(23,27,24,.06),0 20px 44px -22px rgba(23,27,24,.36);
  --radius:3px;
  --stage:min(760px,100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121714;
    --paper-2:#0C100E;
    --card:#1A211D;
    --ink:#E8EBE5;
    --ink-2:#A3AEA7;
    --ink-3:#77837C;
    --rule:#2C3733;
    --rule-soft:#232C28;
    --gold:#D9AB4A;
    --gold-bright:#EFC469;
    --gold-wash:#2E2716;
    --green:#5FBD8E;
    --green-wash:#162C22;
    --red:#E5765D;
    --red-wash:#331C18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45),0 20px 44px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#121714; --paper-2:#0C100E; --card:#1A211D;
  --ink:#E8EBE5; --ink-2:#A3AEA7; --ink-3:#77837C;
  --rule:#2C3733; --rule-soft:#232C28;
  --gold:#D9AB4A; --gold-bright:#EFC469; --gold-wash:#2E2716;
  --green:#5FBD8E; --green-wash:#162C22;
  --red:#E5765D; --red-wash:#331C18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45),0 20px 44px -22px rgba(0,0,0,.8);
}

/* ============ BASE ============ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain;
  font-family:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif; text-wrap:balance; margin:0; font-weight:700;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
  touch-action:manipulation; -webkit-user-select:none; user-select:none}
:focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px; border-radius:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ SHELL ============ */
.shell{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh; min-height:100dvh}

/* -------- RAIL -------- */
.rail{
  background:var(--paper-2); border-right:1px solid var(--rule);
  display:flex; flex-direction:column; gap:0;
  position:sticky; top:0; height:100vh; height:100dvh; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid var(--rule)}
.brand h1{font-size:1.32rem; line-height:1.1; letter-spacing:-.015em; font-variation-settings:"opsz" 40}
.brand h1 em{font-style:normal; color:var(--gold); display:block}
.brand p{margin:7px 0 0; font-size:.78rem; color:var(--ink-3); line-height:1.4}

.railsec{padding:16px 20px; border-bottom:1px solid var(--rule); display:flex; flex-direction:column; gap:10px}
.railsec > .eyebrow{margin-bottom:-2px}

.chaplist{display:flex; flex-direction:column; gap:1px; padding:8px 10px 18px}
.chap{
  display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:9px;
  padding:7px 10px; border-radius:var(--radius); text-align:left; width:100%;
  color:var(--ink-2); font-size:.86rem; line-height:1.25;
}
.chap:hover{background:var(--rule-soft); color:var(--ink)}
.chap .n{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-3)}
.chap .ct{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-3)}
.chap[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:inset 2px 0 0 var(--gold)}
.chap[aria-pressed="true"] .n{color:var(--gold)}
.chapbar{grid-column:1/-1; height:2px; background:var(--rule); border-radius:2px; overflow:hidden; margin-top:3px}
.chapbar i{display:block; height:100%; background:var(--green); width:0}

.railbtns{display:flex; gap:6px}
.mini{
  flex:1; padding:5px 6px; border:1px solid var(--rule); border-radius:var(--radius);
  font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-2); background:var(--card);
}
.mini:hover{border-color:var(--gold); color:var(--gold)}

/* -------- MAIN -------- */
.main{display:flex; flex-direction:column; min-width:0}
.topbar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:14px 28px; border-bottom:1px solid var(--rule); background:var(--paper);
  position:sticky; top:0; z-index:5;
}
.modeswitch{display:flex; border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; background:var(--card)}
.modeswitch button{
  padding:6px 15px; font-family:"IBM Plex Mono",monospace; font-size:.7rem;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
}
.modeswitch button+button{border-left:1px solid var(--rule)}
.modeswitch button[aria-pressed="true"]{background:var(--gold); color:#fff}
:root[data-theme="dark"] .modeswitch button[aria-pressed="true"],
:root:not([data-theme="light"]) .modeswitch button[aria-pressed="true"]{color:#12100A}

.narrow{display:none}
.tally{display:flex; gap:18px; margin-left:auto; align-items:baseline; min-width:0}
.tally div{display:flex; flex-direction:column; align-items:flex-end; gap:1px}
.tally b{font-family:"IBM Plex Mono",monospace; font-size:.98rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1}
.tally span{font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.t-right b{color:var(--green)} .t-wrong b{color:var(--red)}

.progstrip{height:3px; background:var(--rule-soft); position:relative; overflow:hidden}
.progstrip i{position:absolute; inset:0 auto 0 0; background:var(--gold); width:0; transition:width .28s ease}

.stage{flex:1; display:flex; justify-content:center; padding:36px 28px 60px}
.stagein{width:var(--stage); display:flex; flex-direction:column; gap:16px}

/* -------- CARD -------- */
.card{
  background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
/* exercise-book margin rule */
.card::before{
  content:""; position:absolute; left:44px; top:0; bottom:0; width:1px;
  background:var(--red); opacity:.28;
}
@media (max-width:640px){ .card::before{left:26px} }

.cardhead{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 20px 12px 60px; border-bottom:1px solid var(--rule-soft);
}
@media (max-width:640px){ .cardhead{padding-left:40px} }
.tag{
  font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.09em;
  text-transform:uppercase; padding:2px 7px; border-radius:2px;
  background:var(--gold-wash); color:var(--gold); white-space:nowrap;
}
.tag.plain{background:var(--rule-soft); color:var(--ink-3)}
.tag.box{background:transparent; border:1px solid var(--rule); color:var(--ink-3)}
.star{margin-left:auto; font-size:1rem; line-height:1; color:var(--ink-3); padding:3px 5px; border-radius:2px}
.star:hover{color:var(--gold-bright)}
.star[aria-pressed="true"]{color:var(--gold-bright)}

.q{
  padding:26px 26px 26px 60px; font-family:Fraunces,Georgia,serif;
  font-size:1.42rem; line-height:1.32; font-weight:500; letter-spacing:-.008em;
  font-variation-settings:"opsz" 60; text-wrap:pretty;
}
@media (max-width:640px){ .q{padding:20px 18px 20px 40px; font-size:1.2rem} }

/* -------- OPTIONS (marked exercise book) -------- */
.opts{display:flex; flex-direction:column; border-top:1px solid var(--rule-soft)}
.opt{
  display:grid; grid-template-columns:44px 1fr; align-items:start; gap:0;
  text-align:left; width:100%; border-bottom:1px solid var(--rule-soft);
  transition:background .12s ease;
}
@media (max-width:640px){ .opt{grid-template-columns:26px 1fr} }
.opt:last-child{border-bottom:none}
.opt:not(:disabled):hover{background:var(--rule-soft)}
.opt .gutter{
  display:flex; align-items:center; justify-content:center; align-self:stretch;
  padding-top:14px; align-items:flex-start;
}
.opt .key{
  font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3);
  border:1px solid var(--rule); border-radius:2px; width:19px; height:19px;
  display:grid; place-items:center; line-height:1;
}
@media (max-width:640px){ .opt .key{width:17px;height:17px;font-size:.64rem;border:none} }
.opt .txt{padding:13px 20px 13px 16px; font-size:.97rem; line-height:1.45; color:var(--ink)}
.opt .mark{width:22px; height:22px; display:none}
.opt .mark path{fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:60; stroke-dashoffset:60; animation:draw .34s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){ .opt .mark path{animation:none;stroke-dashoffset:0} }

.opt.is-right{background:var(--green-wash)}
.opt.is-right .txt{color:var(--ink); font-weight:600}
.opt.is-right .key{display:none} .opt.is-right .mark{display:block; stroke:var(--green)}
.opt.is-wrong{background:var(--red-wash)}
.opt.is-wrong .txt{color:var(--ink); text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:1.5px}
.opt.is-wrong .key{display:none} .opt.is-wrong .mark{display:block; stroke:var(--red)}
.opt.is-muted .txt{color:var(--ink-3)}

/* -------- FLIP MODE -------- */
.answer{
  padding:24px 26px 24px 60px; border-top:1px solid var(--rule-soft);
  background:var(--green-wash);
}
@media (max-width:640px){ .answer{padding:18px 18px 18px 40px} }
.answer .eyebrow{color:var(--green); margin-bottom:6px}
.answer p{margin:0; font-size:1.06rem; line-height:1.5; font-weight:600}

/* -------- ACTION BAR -------- */
.actions{display:flex; gap:8px; flex-wrap:wrap}
.btn{
  padding:9px 18px; border:1px solid var(--rule); border-radius:var(--radius);
  background:var(--card); font-size:.87rem; font-weight:600; color:var(--ink);
  display:inline-flex; align-items:center; gap:7px;
}
.btn:hover{border-color:var(--ink-3)}
.btn kbd{font-family:"IBM Plex Mono",monospace; font-size:.64rem; color:var(--ink-3); border:1px solid var(--rule); border-radius:2px; padding:0 4px}
.btn-primary{background:var(--gold); border-color:var(--gold); color:#fff}
.btn-primary kbd{color:rgba(255,255,255,.72); border-color:rgba(255,255,255,.4)}
.btn-primary:hover{background:var(--gold-bright); border-color:var(--gold-bright)}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary{color:#12100A}
:root[data-theme="dark"] .btn-primary kbd,
:root:not([data-theme="light"]) .btn-primary kbd{color:rgba(18,16,10,.6); border-color:rgba(18,16,10,.3)}
.btn-again{color:var(--red); border-color:var(--red)}
.btn-good{color:var(--green); border-color:var(--green)}
.btn.grow{flex:1; justify-content:center}

.hint{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-3); letter-spacing:.03em}

/* -------- PANELS (stats / setup) -------- */
.panel{background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow)}
.panel h2{font-size:1.12rem; margin-bottom:4px; font-variation-settings:"opsz" 40}
.panel p.sub{margin:0 0 18px; color:var(--ink-2); font-size:.9rem}

.boxgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:8px; margin-top:6px}
.boxcell{border:1px solid var(--rule); border-radius:var(--radius); padding:10px 11px; display:flex; flex-direction:column; gap:3px}
.boxcell b{font-family:"IBM Plex Mono",monospace; font-size:1.3rem; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.boxcell span{font-family:"IBM Plex Mono",monospace; font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.boxcell.b0 b{color:var(--ink-3)} .boxcell.b1 b{color:var(--red)}
.boxcell.b2 b{color:var(--gold)} .boxcell.b3 b{color:var(--gold-bright)}
.boxcell.b4 b{color:var(--green)} .boxcell.b5 b{color:var(--green)}

.masterlist{display:flex; flex-direction:column; gap:9px; margin-top:14px}
.mrow{display:grid; grid-template-columns:1fr 54px; gap:12px; align-items:center}
.mrow .lbl{font-size:.86rem; color:var(--ink-2); display:flex; align-items:baseline; gap:8px; min-width:0}
.mrow .lbl b{font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mrow .lbl i{font-family:"IBM Plex Mono",monospace; font-style:normal; font-size:.66rem; color:var(--ink-3)}
.mrow .track{grid-column:1/-1; height:6px; background:var(--rule-soft); border-radius:3px; overflow:hidden; display:flex}
.mrow .track i{display:block; height:100%}
.mrow .track .learned{background:var(--green)}
.mrow .track .learning{background:var(--gold)}
.mrow .pct{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums}

.setupgrid{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}
.chip{
  padding:6px 13px; border:1px solid var(--rule); border-radius:var(--radius);
  font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-2); background:var(--card);
}
.chip[aria-pressed="true"]{background:var(--gold-wash); border-color:var(--gold); color:var(--gold)}
.chip:hover{border-color:var(--gold)}

.done{text-align:center; padding:44px 24px}
.done .score{font-family:Fraunces,serif; font-size:3.6rem; font-weight:900; line-height:1; font-variation-settings:"opsz" 144; color:var(--gold)}
.done h2{font-size:1.5rem; margin:14px 0 6px}
.done p{color:var(--ink-2); margin:0 auto 22px; max-width:44ch}

.empty{text-align:center; padding:56px 20px; color:var(--ink-3)}

/* -------- MOBILE -------- */
.railtoggle{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:fixed; inset:0 auto 0 0; width:min(300px,86vw); z-index:40;
    transform:translateX(-101%); transition:transform .22s ease; box-shadow:var(--shadow-lift);
    padding-bottom:env(safe-area-inset-bottom);
  }
  body.rail-open .rail{transform:none}
  body.rail-open{overflow:hidden}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:35}
  body.rail-open .scrim{display:block}
  .railtoggle{display:inline-flex; padding:7px 12px; border:1px solid var(--rule); border-radius:var(--radius);
    font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; background:var(--card)}
  .topbar{padding:9px 14px; gap:10px; flex-wrap:nowrap}
  .modeswitch button{padding:7px 11px; font-size:.66rem}
  .stage{padding:16px 12px 20px}
  .tally{gap:11px}
  .tally span{display:none}
  .tally b{font-size:1.02rem}
  .tally div{align-items:center}
  .hint{display:none}

  /* one-handed: actions pin to the bottom of the screen */
  .stagein{gap:12px}
  .actions.pinned{
    position:sticky; bottom:0; z-index:6;
    margin:0 -12px -20px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 62%,transparent);
  }
  .actions.pinned .btn{padding:14px 18px; font-size:.95rem}
  .actions.pinned kbd{display:none}

  /* thumb-sized answer rows */
  .opt .txt{padding:15px 16px 15px 13px; font-size:1rem}
  .opt{min-height:52px}
  .opt .gutter{padding-top:16px}
  .cardhead{padding-top:10px; padding-bottom:10px}
  .star{padding:6px 8px; margin:-4px -4px -4px auto; font-size:1.15rem}
}
@media (max-width:900px) and (min-width:641px){
  .actions.pinned{margin:0 -12px -20px}
}
/* larger phones in landscape / small tablets keep the roomier card */
@media (max-width:420px){
  .q{font-size:1.14rem}
  .tag{font-size:.58rem; padding:2px 5px}
  .topbar{gap:8px}
  .railtoggle{padding:7px 10px; font-size:.64rem}
  .modeswitch button{padding:7px 10px}
  .narrow{display:inline} .wide{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important} }
</style>
</head>
<body>
<noscript><div style="font:16px/1.5 system-ui,sans-serif;padding:24px;max-width:620px;margin:0 auto">
<strong>JavaScript is switched off.</strong> This deck needs it to shuffle and mark cards. Turn it on and reload.
</div></noscript>

<script>
window.__mb = {ok: false};

function __mbFail(msg) {
  var esc = String(msg).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  var panel =
    '<div role="alert" style="font:16px/1.55 system-ui,-apple-system,sans-serif;color:#171B18;' +
    'background:#fff;border:1px solid #D6DACE;border-radius:4px;padding:22px;margin:24px auto;' +
    'max-width:620px">' +
    '<strong style="display:block;font-size:1.08rem;margin-bottom:10px">This copy did not finish loading</strong>' +
    '<p style="margin:0 0 10px">The whole deck lives in this one file, all 1,235 cards, so it has to ' +
    'arrive complete. A blank screen here almost always means the download was cut short, or the file ' +
    'was opened inside a chat preview instead of a real browser.</p>' +
    '<p style="margin:0 0 14px"><b>Fix:</b> download it again, then open it from your Files app and ' +
    'pick Chrome or Safari.</p>' +
    '<code style="display:block;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;' +
    'background:#F3F4EF;color:#7A2E1E;padding:9px;border-radius:3px;word-break:break-word">' +
    esc + "</code></div>";
  var stage = document.getElementById("stage");
  if (stage) {
    stage.innerHTML = panel;
  } else if (document.body) {
    document.body.insertAdjacentHTML("beforeend", panel);
  }
}

window.addEventListener("error", function (ev) {
  if (window.__mb.ok) return;
  __mbFail(ev && ev.message ? ev.message : "The card data did not load.");
});

/* A truncated file can end mid-script, in which case no error event ever
   fires. Catch that case once the page has settled. */
window.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {
    if (window.__mb.ok) return;
    var n = window.CARDS && window.CARDS.length;
    __mbFail(n ? "Only " + n + " of 1235 cards arrived." : "The card data did not load.");
  }, 400);
});

</script>

<div class="scrim" id="scrim"></div>
<div class="shell">

  <!-- ===== RAIL ===== -->
  <aside class="rail" id="rail">
    <div class="brand">
      <h1>The Marking<em>Book</em></h1>
      <p>GES Promotion Handbook &mdash; every chapter, drilled as multiple choice.</p>
    </div>

    <div class="railsec">
      <div class="eyebrow">Deck</div>
      <div class="boxgrid" id="railboxes"></div>
    </div>

    <div class="railsec">

 NPP government under Kufuor","The NDC government under Rawlings","The NPP government under Akufo-Addo"]},{"c":2,"g":"reform2008","q":"Which are the key features of the 2008 educational reform?","a":"Introduction of ICT and Creative Arts; mainstreaming of KG education; and making SHS education four years","d":["Reduction of pre-tertiary education to 12 years","Introduction of continuous assessment","Establishment of the GES"]},{"c":2,"g":"dzobo","q":"Which committee produced the 1974 New Structure and Content of Education?","a":"The Dzobo Committee","d":["The Anamuah-Mensah Committee","The Evans-Anfom Committee","The Nkrumah Committee"]},{"c":2,"g":"dzobo","q":"Which service did the 1974 educational structure establish?","a":"The Ghana Teaching Service, now the Ghana Education Service","d":["The National Teaching Council","The Ghana Technical Education Service","The Ghana Inspectorate Service"]},{"c":2,"g":"dzobo","q":"In what year was the JSS concept piloted under the Dzobo reforms?","a":"1976","d":["1974","1978","1980"]},{"c":2,"g":"dzobo","q":"Which system did the three-year JSS replace?","a":"The four-year middle school system","d":["The six-year primary system","The five-year secondary system","The sixth form system"]},{"c":2,"g":"dzobo","q":"What did the 1974 reforms do to the five-year secondary school?","a":"Reduced it to four years and abolished the sixth form","d":["Reduced it to three years","Extended it to six years","Left it unchanged"]},{"c":2,"g":"dzobo","q":"On what content was emphasis laid at Primary and JSS level under the 1974 reforms?","a":"Languages, Mathematics, Science, Agriculture and Practical/Vocational subjects","d":["ICT, Creative Arts and RME","Social Studies and History","Business and Accounting"]},{"c":2,"g":"reform1987","q":"Which committee was set up to review education policy in 1987?","a":"The Evans-Anfom Committee","d":["The Dzobo Committee","The Anamuah-Mensah Committee","The Anin Committee"]},{"c":2,"g":"reform1987","q":"What was the objective of the 1987 Education Reform?","a":"To expand and improve the level and quality of education and make basic education free and compulsory","d":["To introduce ICT and Creative Arts","To establish the GES","To create the free SHS policy"]},{"c":2,"g":"reform1987","q":"The 1987 committee reduced pre-tertiary education from which structure to which?","a":"From 13 years (6-3-4) to 12 years (6-3-3)","d":["From 17 years to 12 years directly","From 15 years (2-6-3-4) to 12 years","From 12 years to 11 years"]},{"c":2,"g":"reform1987","q":"Which is a key feature of the 1987 educational reforms?","a":"Introduction of Continuous Assessment","d":["Introduction of ICT and Creative Arts","Mainstreaming of KG","Introduction of the NSAT"]},{"c":2,"g":"reform1987","q":"Which is a key feature of the 1987 educational reforms?","a":"Introduction of non-formal education","d":["Abolition of the sixth form","Establishment of the GES","Introduction of the Free SHS policy"]},{"c":2,"g":"interventions","q":"In what year was free textbook distribution introduced?","a":"1963","d":["1964","1974","1987"]},{"c":2,"g":"interventions","q":"In what year were continuation schools introduced?","a":"1964","d":["1963","1974","1956"]},{"c":2,"g":"interventions","q":"In what year was the GES established (as listed under key interventions)?","a":"1974","d":["1961","1987","1995"]},{"c":2,"g":"interventions","q":"In what year was FCUBE introduced?","a":"1995","d":["1996","1992","2005"]},{"c":2,"g":"interventions","q":"In what year was the Computerised School Selection and Placement System (CSSPS) introduced?","a":"2005","d":["2008","2003","2007"]},{"c":2,"g":"interventions","q":"In what year was the school feeding programme piloted?","a":"2005","d":["2006","2008","2003"]},{"c":2,"g":"interventions","q":"In what year were Teacher Training Colleges converted to Colleges of Education?","a":"2008","d":["2007","2010","2005"]},{"c":2,"g":"interventions","q":"In what year was Progressively Free SHS implemented?","a":"2013","d":["2017","2016","2012"]},{"c":2,"g":"interventions","q":"In what year were Polytechnics converted to Technical Universities?","a":"2016","d":["2017","2013","2015"]},{"c":2,"g":"interventions","q":"In what year was Free SHS implemented?","a":"2017","d":["2013","2016","2018"]},{"c":2,"g":"policy","q":"What is a 'policy'?","a":"A deliberate system of principles to guide decisions and achieve rational outcomes; a statement of intent implemented as a procedure or protocol","d":["A law passed by Parliament","A rule made by a headmaster","A judicial decision"]},{"c":2,"g":"policy","q":"What does education policy consist of?","a":"The principles and government policies in the educational sphere, plus the collection of laws and rules that govern the operation of education systems","d":["Only the Acts of Parliament on education","Only the curriculum and syllabuses","Only the GES code of conduct"]},{"c":2,"g":"policy","q":"Which of these is a public education policy in Ghana?","a":"Capitation grant policy","d":["The GES Act 506","The Education Act 778","The 1992 Constitution"]},{"c":2,"g":"policy","q":"Which of these is a public education policy in Ghana?","a":"Complementary Basic Education (CBE) policy","d":["The Local Government Act","The National Pensions Act","The Audit Service Act"]},{"c":2,"g":"policy","q":"Name the six public education policies listed in the handbook.","a":"School age policy; ICT in education policy; Capitation grant policy; Complementary Basic Education policy; Free SHS policy; School feeding policy","d":["FCUBE, CSSPS, NALAP, capitation, free SHS and deboardinisation","Free SHS, school feeding, capitation, NALAP, girl-child and textbooks","School age, ICT, free SHS, school feeding, textbooks and CSSPS"]},{"c":3,"g":"learning-def","q":"What is learning?","a":"A process that results in a change in knowledge or behaviour as a result of experience","d":["The acquisition of certificates through schooling","The process of memorising facts","The transmission of knowledge from teacher to pupil"]},{"c":3,"g":"learning-def","q":"According to Driscoll (2005), learning is defined by what?","a":"The learner's experience and interaction with the world","d":["The teacher's method of instruction","Repetition and drill","Reinforcement and punishment"]},{"c":3,"g":"learning-def","q":"If there is no change in behaviour in relation to daily life, what does this mean?","a":"Learning has not taken place","d":["Learning is incomplete","Teaching has failed","The learner is not motivated"]},{"c":3,"g":"learning-chars","q":"Which is a characteristic of learning?","a":"Learning is a lifelong process","d":["Learning ends at school","Learning is passive","Learning requires no interaction"]},{"c":3,"g":"learning-chars","q":"Which is a characteristic of learning?","a":"Experience is necessary for learning","d":["Learning happens without experience","Learning is purely genetic","Learning requires no problem solving"]},{"c":3,"g":"learning-chars","q":"Which is a characteristic of learning?","a":"Learning occurs randomly throughout life","d":["Learning occurs only in classrooms","Learning is always planned","Learning occurs only in childhood"]},{"c":3,"g":"principles-learn","q":"Name the five principles of learning.","a":"Participation, Repetition, Relevance, Transference and Feedback","d":["Motivation, Practice, Interest, Reward and Punishment","Readiness, Exercise, Effect, Reward and Feedback","Attention, Retention, Reproduction, Motivation and Reinforcement"]},{"c":3,"g":"principles-learn","q":"Which principle of learning says learning should permit and encourage ACTIVE involvement of the learner?","a":"Participation","d":["Repetition","Relevance","Transference"]},{"c":3,"g":"principles-learn","q":"Which principle of learning explains why most people never forget how to ride a bicycle?","a":"Participation","d":["Repetition","Feedback","Relevance"]},{"c":3,"g":"principles-learn","q":"Which principle of learning provides the learner with the opportunity for practice, so behaviours are OVERLEARNED?","a":"Repetition","d":["Participation","Relevance","Transference"]},{"c":3,"g":"principles-learn","q":"Which principle of learning says learning should be problem-centred rather than content-centred?","a":"Relevance","d":["Participation","Repetition","Feedback"]},{"c":3,"g":"principles-learn","q":"Which principle of learning asks whether learning will carry over to the actual job situation?","a":"Transference","d":["Relevance","Feedback","Participation"]},{"c":3,"g":"principles-learn","q":"Which principle of learning gives learners information on their progress?","a":"Feedback","d":["Repetition","Relevance","Transference"]},{"c":3,"g":"transfer","q":"What is POSITIVE transfer of training?","a":"When training activities ENHANCE performance in the new situation","d":["When training activities inhibit performance","When training has no observable effect","When training must be repeated"]},{"c":3,"g":"transfer","q":"What is NEGATIVE transfer of training?","a":"When training activities INHIBIT performance in a new situation","d":["When training enhances performance","When training has no effect","When learning is forgotten"]},{"c":3,"g":"transfer","q":"How many transfer-of-training situations are possible?","a":"Three — positive transfer, negative transfer, and no observable effect","d":["Two — positive and negative","Four","Five"]},{"c":3,"g":"feedback","q":"Why is merely telling trainees they were wrong ineffective?","a":"Because effective feedback must tell them WHY they were wrong and how to avoid making the mistake in future","d":["Because feedback should always be positive","Because feedback should be delayed","Because feedback should be written"]},{"c":3,"g":"theory-def","q":"What is a theory?","a":"A set of principles or laws about a phenomenon that seeks to explain its occurrence and predict its occurrence in the future","d":["A proven scientific fact","An untested guess","A rule for classroom practice"]},{"c":3,"g":"theory-def","q":"What is a LEARNING theory?","a":"A set of concepts or constructs that explain how learning occurs in an organism and can predict how learning will occur in a given situation","d":["A method of teaching","A curriculum framework","A rule for assessing pupils"]},{"c":3,"g":"theory-def","q":"In which two major paradigms are learning theories rooted?","a":"The behavioural approaches and the cognitive approaches to learning","d":["Constructivism and humanism","Classical and operant conditioning","Cognitivism and constructivism"]},{"c":3,"g":"behaviourism","q":"What is behaviourism?","a":"A theory of learning based on the idea that all behaviour is acquired through conditioning, occurring through interaction with the environment","d":["A theory that focuses on internal mental processes","A theory that learners construct their own knowledge","A theory that learning fulfils human potential"]},{"c":3,"g":"behaviourism","q":"For behaviourism, how should behaviour be explained?","a":"By observable experience, not by mental processes","d":["By mental processes and schemata","By the learner's construction of meaning","By the learner's feelings and motives"]},{"c":3,"g":"behaviourism","q":"Why do behaviourists exclude thoughts, feelings and motives from a science of behaviour?","a":"Because they cannot be DIRECTLY OBSERVED","d":["Because they are unimportant","Because they are genetic","Because they cannot be measured numerically"]},{"c":3,"g":"behaviourism","q":"What is 'associative learning'?","a":"Learning that two events are connected (associated)","d":["Learning by observing others","Learning by constructing meaning","Learning by trial and error"]},{"c":3,"g":"behaviourism","q":"Which two behavioural views emphasise associative learning?","a":"Classical conditioning and operant conditioning","d":["Cognitivism and constructivism","Social cognitive and information processing","Humanism and constructivism"]},{"c":3,"g":"cognitivism","q":"What is cognitivism?","a":"A learning theory that focuses on the PROCESSES involved in learning rather than on the observed behaviour","d":["A theory that all behaviour is conditioned","A theory that learning is a personal act to fulfil potential","A theory of reinforcement and punishment"]},{"c":3,"g":"cognitivism","q":"In cognitivism, how is learning defined?","a":"As a change in a learner's schemata","d":["As a change in observable behaviour","As the acquisition of certificates","As the strengthening of stimulus-response bonds"]},{"c":3,"g":"cognitive-4","q":"Which cognitive approach emphasises observational learning — that students learn what they observe and model what they see others do?","a":"Social Cognitive Approach","d":["Cognitive Information Processing","Cognitive Constructivism","Social Constructivism"]},{"c":3,"g":"cognitive-4","q":"Which cognitive approach focuses on how learners process information through attention, memory and thinking?","a":"Cognitive Information Processing","d":["Social Cognitive Approach","Cognitive Constructivism","Social Constructivism"]},{"c":3,"g":"cognitive-4","q":"Which cognitive approach emphasises the learner's OWN cognitive construction of knowledge and understanding?","a":"Cognitive Constructivism","d":["Social Constructivism","Social Cognitive Approach","Cognitive Information Processing"]},{"c":3,"g":"cognitive-4","q":"Which cognitive approach emphasises COLLABORATION with others to produce knowledge and understanding?","a":"Social Constructivism","d":["Cognitive Constructivism","Social Cognitive Approach","Cognitive Information Processing"]},{"c":3,"g":"thorndike","q":"Who developed instrumental conditioning (trial and error learning)?","a":"Thorndike","d":["B.F. Skinner","Ivan Pavlov","Albert Bandura"]},{"c":3,"g":"thorndike","q":"Instrumental conditioning is also known as what?","a":"Trial and error learning","d":["Operant conditioning","Classical conditioning","Observational learning"]},{"c":3,"g":"thorndike","q":"How many laws of learning did Thorndike develop?","a":"Three","d":["Two","Four","Five"]},{"c":3,"g":"thorndike-laws","q":"Which law of Thorndike states that when the learner is physiologically and psychologically READY for a learning task, learning is effectively accomplished?","a":"The Law of Readiness","d":["The Law of Exercise","The Law of Effect","The Law of Repetition"]},{"c":3,"g":"thorndike-laws","q":"Which law of Thorndike states that the more frequently a learning task is practised, the easier it is to recall?","a":"The Law of Exercise","d":["The Law of Readiness","The Law of Effect","The Law of Association"]},{"c":3,"g":"thorndike-laws","q":"Which law of Thorndike concerns the strengthening or weakening of a connection as a result of its CONSEQUENCE?","a":"The Law of Effect","d":["The Law of Exercise","The Law of Readiness","The Law of Reinforcement"]},{"c":3,"g":"thorndike-laws","q":"Which of Thorndike's laws explains why drills, quizzes and distributed practice are important?","a":"The Law of Exercise","d":["The Law of Readiness","The Law of Effect","The Law of Interest"]},{"c":3,"g":"thorndike-laws","q":"Which of Thorndike's laws means teachers must use motivational techniques to get students READY for a new learning task?","a":"The Law of Readiness","d":["The Law of Exercise","The Law of Effect","The Law of Correlation"]},{"c":3,"g":"operant","q":"Who demonstrated operant conditioning, in 1938?","a":"B.F. Skinner","d":["Thorndike","Pavlov","Maslow"]},{"c":3,"g":"operant","q":"How did Skinner define a 'reinforcer'?","a":"Any consequence that increases the frequency of some operant or desirable behaviour","d":["Any unpleasant consequence","Any reward given at the end of a lesson","Any stimulus that produces a response"]},{"c":3,"g":"operant","q":"In Skinner's terms, what is reinforcement?","a":"Either giving the organism what it WANTS, or taking away what it does NOT want","d":["Giving what it does not want, or taking away what it wants","Only giving rewards","Only removing punishments"]},{"c":3,"g":"operant","q":"In Skinner's terms, what is punishment?","a":"Either giving the organism what it does NOT want, or taking away what it DOES want","d":["Giving what it wants or removing what it does not want","Only physical discipline","Only verbal scolding"]},{"c":3,"g":"operant-4","q":"How many basic mechanisms accomplish operant conditioning?","a":"Four","d":["Two","Three","Five"]},{"c":3,"g":"operant-4","q":"Which operant mechanism means responses that are REWARDED are likely to be repeated?","a":"Positive reinforcement","d":["Negative reinforcement","Non-reinforcement","Punishment"]},{"c":3,"g":"operant-4","q":"Which operant mechanism means responses that ESCAPE from a painful or undesirable situation are likely to be repeated?","a":"Negative reinforcement","d":["Positive reinforcement","Punishment","Non-reinforcement"]},{"c":3,"g":"operant-4","q":"Ignoring students who call out answers without raising their hands is an example of which operant mechanism?","a":"Non-reinforcement","d":["Punishment","Negative reinforcement","Positive reinforcement"]},{"c":3,"g":"operant-4","q":"Which operant mechanism means responses that bring painful or undesirable consequences will be SUPPRESSED?","a":"Punishment","d":["Non-reinforcement","Negative reinforcement","Positive reinforcement"]},{"c":3,"g":"operant-4","q":"Why must reinforcement follow the desired response immediately?","a":"Because delays render reinforcement ineffective","d":["Because students forget the lesson","Because it is a school rule","Because it saves time"]},{"c":3,"g":"operant-4","q":"Which are common reinforcers in the classroom?","a":"Praise, nodding, clapping, awarding grades and granting special privileges","d":["Detention, scolding and extra work","Withdrawal of privileges","Silence and isolation"]},{"c":3,"g":"reinforcement","q":"What is reinforcement?","a":"The presentation of a stimulus to an organism that increases the likelihood of a prior behaviour recurring","d":["The removal of a stimulus to decrease behaviour","The suppression of an unwanted response","The pairing of two stimuli"]},{"c":3,"g":"reinforcement","q":"A reinforcer strengthens a response in which two ways?","a":"By the presentation of a positive stimulus, or the removal of a negative stimulus","d":["By presentation of a negative stimulus or removal of a positive one","Only by giving rewards","Only by removing punishments"]},{"c":3,"g":"reinforcement","q":"Moving a student from the back seat to the front to help him concentrate is an example of what?","a":"Negative reinforcement","d":["Positive reinforcement","Positive punishment","Negative punishment"]},{"c":3,"g":"reinforcement","q":"Do BOTH positive and negative reinforcement increase or decrease behaviour?","a":"Both functionally INCREASE the occurrence of behaviour","d":["Positive increases, negative decreases","Both decrease behaviour","Neither affects behaviour"]},{"c":3,"g":"reinf-types","q":"What are PRIMARY reinforcers?","a":"Those that affect behaviour without the necessity of learning — natural reinforcers such as food and water","d":["Stimuli that acquire power through association","Social rewards like praise","Money and grades"]},{"c":3,"g":"reinf-types","q":"What are CONDITIONED reinforcers?","a":"Stimuli that acquire reinforcing power because they have been associated with a primary reinforcer, e.g. praise and money","d":["Food and water","Natural reinforcers requiring no learning","Physiological needs"]},{"c":3,"g":"reinf-types","q":"Praise is also referred to as which kind of reinforcer?","a":"A social reinforcer","d":["A primary reinforcer","A negative reinforcer","A natural reinforcer"]},{"c":3,"g":"punishment","q":"What is POSITIVE punishment?","a":"The presentation of an aversive (unpleasant) stimulus to reduce the frequency of a behaviour, e.g. scolding a child","d":["The withdrawal of a pleasant consequence","The removal of an aversive stimulus","Ignoring a behaviour"]},{"c":3,"g":"punishment","q":"What is NEGATIVE punishment?","a":"The withdrawal of a positive consequence, which serves to reduce the frequency of a behaviour","d":["The presentation of an aversive stimulus","The removal of an unpleasant stimulus","Rewarding a desired behaviour"]},{"c":3,"g":"punishment","q":"A child who kicks another while playing and is made to sit indoors while colleagues play outside experiences what?","a":"Negative punishment","d":["Positive punishment","Negative reinforcement","Non-reinforcement"]},{"c":3,"g":"constructivism","q":"What is constructivism?","a":"A learning theory that explains how people acquire knowledge — suggesting humans CONSTRUCT knowledge and meaning from their experiences","d":["A theory that behaviour is conditioned by the environment","A theory that learning fulfils personal potential","A theory of information processing"]},{"c":3,"g":"constructivism","q":"What is constructivism's central idea?","a":"That human learning is constructed — learners build new knowledge upon the foundation of previous learning","d":["That learning is a change in observable behaviour","That knowledge is transmitted from teacher to learner","That reinforcement shapes learning"]},{"c":3,"g":"constructivism","q":"What is the first important notion of constructed knowledge?","a":"That learners construct new understandings using what they already know — there is no 'tabula rasa'","d":["That learning is passive","That knowledge is imprinted on a blank slate","That teachers transmit knowledge"]},{"c":3,"g":"constructivism","q":"What is the second important notion of constructed knowledge?","a":"That learning is ACTIVE rather than passive — learners remain active throughout the process","d":["That learning is passive absorption","That knowledge comes only from the teacher","That prior knowledge is irrelevant"]},{"c":3,"g":"constructivism","q":"In constructivism, what role does the teacher take?","a":"A 'guide on the side' who provides students with opportunities to test the adequacy of their current understandings","d":["A 'sage on the stage' who transmits knowledge","A disciplinarian","An assessor only"]},{"c":3,"g":"humanism","q":"Who are the founders and proponents of humanism?","a":"Abraham Maslow and Carl Rogers","d":["B.F. Skinner and Thorndike","Piaget and Vygotsky","Bandura and Bruner"]},{"c":3,"g":"humanism","q":"What is the basic idea of humanism?","a":"Learning is a personal act to fulfil one's potential","d":["Learning is a change in observable behaviour","Learning is the processing of information","Learning is constructed from experience"]},{"c":3,"g":"humanism","q":"What is the goal of humanist education?","a":"Developing self-actualised people in a cooperative and supportive environment","d":["Producing high examination scores","Shaping observable behaviour","Transmitting cultural knowledge"]},{"c":3,"g":"humanism","q":"In humanism, how is the learner viewed?","a":"As one with AFFECTIVE and COGNITIVE needs","d":["As a blank slate","As a conditioned organism","As a processor of information"]},{"c":3,"g":"motivation","q":"How is motivation defined (Elliot et al, 2000)?","a":"An internal state that arouses us to action, pushes us in particular directions and keeps us engaging in certain activities","d":["An external reward system","The desire to obtain good grades","A teacher's method of encouraging pupils"]},{"c":3,"g":"motivation","q":"What is INTRINSIC motivation?","a":"Participation in an activity purely out of curiosity, or the desire to engage in an activity for the sake of participating in and completing a task","d":["Motivation arising from external rewards","Motivation to obtain a certificate","Motivation to avoid punishment"]},{"c":3,"g":"motivation","q":"What is EXTRINSIC motivation?","a":"Motives that are OUTSIDE of and separate from the behaviour they cause — the motive is not inherent in the behaviour itself","d":["Curiosity and the need to know","The desire to complete a task for its own sake","The desire to contribute"]},{"c":3,"g":"motivation","q":"A student who studies hard because a good grade will result in a brand new car illustrates what?","a":"Extrinsic motivation","d":["Intrinsic motivation","Self-actualisation","Positive reinforcement"]},{"c":3,"g":"maslow","q":"Which is the FIRST (most basic) level of Maslow's hierarchy of needs?","a":"Physiological needs","d":["Safety needs","Love and belongingness needs","Esteem needs"]},{"c":3,"g":"maslow","q":"Which is the HIGHEST level of Maslow's hierarchy of needs?","a":"Self-actualisation","d":["Esteem needs","Love and belongingness","Safety needs"]},{"c":3,"g":"maslow","q":"Which Maslow need represents security, protection, and freedom from fear and anxiety?","a":"Safety needs","d":["Physiological needs","Love and belongingness needs","Esteem needs"]},{"c":3,"g":"maslow","q":"Which Maslow need refers to our needs for family and friends?","a":"Love and belongingness needs","d":["Safety needs","Esteem needs","Self-actualisation"]},{"c":3,"g":"maslow","q":"Which Maslow need encompasses the reactions of others towards us and our opinion of ourselves?","a":"Esteem needs","d":["Love and belongingness needs","Safety needs","Self-actualisation"]},{"c":3,"g":"maslow","q":"Students who frequently do not eat breakfast and become lethargic illustrate which unmet Maslow need?","a":"Physiological needs","d":["Safety needs","Esteem needs","Love and belongingness needs"]},{"c":3,"g":"maslow","q":"Which Maslow need is described as the tendency to feel restless unless we are being all that we can be?","a":"Self-actualisation","d":["Esteem needs","Love and belongingness","Safety needs"]},{"c":3,"g":"motivating","q":"Which is a technique for motivating students?","a":"Avoid creating intense competition among students","d":["Encourage intense competition among students","Withhold feedback until the end of term","Set very low expectations"]},{"c":3,"g":"motivating","q":"Which is a technique for motivating students?","a":"Hold high but REALISTIC expectations for your students","d":["Hold very low expectations","Hold impossibly high expectations","Avoid stating expectations"]},{"c":3,"g":"motivating","q":"Which is a technique for motivating students?","a":"Give students feedback as quickly as possible","d":["Delay feedback to build suspense","Give feedback only at the end of the year","Give feedback only to top students"]},{"c":3,"g":"scaffolding","q":"What is scaffolding?","a":"A technique of changing the level of support over the course of a teaching session, adjusting guidance to fit the student's current performance level","d":["Grouping students by ability","Rewarding correct responses immediately","Teaching from simple to complex"]},{"c":3,"g":"scaffolding","q":"In scaffolding, what happens as the student's competence increases?","a":"Less guidance is provided","d":["More guidance is provided","Guidance remains constant","Guidance is withdrawn entirely at once"]},{"c":3,"g":"scaffolding","q":"What is the key rule of scaffolding?","a":"Don't do for students what they can do for themselves, but monitor their effort and give support when needed","d":["Always solve problems for the student first","Never intervene once teaching begins","Give the same support to all students"]},{"c":3,"g":"apprenticeship","q":"What is a cognitive apprenticeship (Barbara Rogoff, 1990)?","a":"A situation in which an EXPERT stretches and supports a NOVICE's understanding of the use of the culture's skills","d":["A student teaching another student of the same age","Learning by trial and error","A group of students working on a shared project"]},{"c":3,"g":"apprenticeship","q":"What does the term 'apprenticeship' in cognitive apprenticeship underscore?","a":"The importance of ACTIVITY in learning, and the situated nature of learning","d":["The importance of memorisation","The role of reinforcement","The value of formal assessment"]},{"c":3,"g":"tutoring","q":"What is tutoring?","a":"A cognitive apprenticeship between an expert and a novice — between an adult and a child, or between a more-skilled and a less-skilled student","d":["Group work of four students","Whole-class instruction","Self-directed study"]},{"c":3,"g":"tutoring","q":"What is CROSS-AGE peer tutoring?","a":"Peer tutoring where the tutoring peer is OLDER","d":["Peer tutoring where the peer is the same age","Tutoring by an adult","Tutoring in mixed-ability groups"]},{"c":3,"g":"tutoring","q":"Why may SAME-AGE peer tutoring be less desirable?","a":"Because being tutored by a same-age classmate is more likely to embarrass a student and create negative comparison","d":["Because same-age peers know less","Because it takes more time","Because it requires more supervision"]},{"c":3,"g":"coop","q":"What is cooperative learning?","a":"When students work in small groups to help each other learn","d":["When one student teaches another","When an expert supports a novice","When students study independently"]},{"c":3,"g":"coop","q":"What is the typical size of a cooperative learning group?","a":"About four students","d":["About two students","About six students","About ten students"]},{"c":3,"g":"coop","q":"What is cooperative learning done in pairs called?","a":"Dyads","d":["Triads","Clusters","Scaffolds"]},{"c":3,"g":"coop","q":"Under which TWO conditions is cooperative learning especially effective (Slavin, 1995)?","a":"When group rewards are generated, and when individuals are held accountable","d":["When groups are homogeneous and small","When the teacher assigns all the work","When students are of the same ability"]},{"c":3,"g":"coop","q":"What is 'social loafing' in cooperative learning?","a":"When some students let others do the work","d":["When students chat instead of working","When students refuse to join a group","When one student dominates the group"]},{"c":3,"g":"coop-approaches","q":"What does 'STAD' stand for?","a":"Student Team-Achievement Division","d":["Student Task Achievement Design","Structured Team Assessment Development","Student Teaching and Development"]},{"c":3,"g":"coop-approaches","q":"In STAD, to whom are rewards given?","a":"To teams whose members improve the MOST over their past performance","d":["To the highest-scoring team overall","To individual top scorers","To the team that finishes first"]},{"c":3,"g":"coop-approaches","q":"In STAD, how many members are in a team?","a":"Four or five members","d":["Two or three members","Six or seven members","Eight members"]},{"c":3,"g":"coop-approaches","q":"Who created the 'Learning Together' approach with its four components?","a":"David and Robert Johnson (1994)","d":["Shlomo Sharan","Slavin","Dansereau"]},{"c":3,"g":"coop-approaches","q":"What are the four components of the Johnsons' approach?","a":"Face-to-face interaction; positive interdependence; individual accountability; and development of interpersonal group skills","d":["Rewards, accountability, grouping and feedback","Planning, doing, reviewing and reporting","Reading, discussing, writing and presenting"]},{"c":3,"g":"coop-approaches","q":"Who developed the Group Investigation approach (1992)?","a":"Shlomo Sharan","d":["David and Robert Johnson","Slavin","Dansereau"]},{"c":3,"g":"coop-approaches","q":"In Group Investigation, what is the group size?","a":"Two to six members","d":["Four or five members","Exactly four members","Eight to ten members"]},{"c":3,"g":"coop-approaches","q":"In Group Investigation, who chooses the problem for the class to study?","a":"The teacher — but group members decide what THEY want to study in exploring it","d":["The group members alone","The school head","The students individually"]},{"c":3,"g":"coop-approaches","q":"In Group Investigation, what is the teacher's role?","a":"To facilitate investigation and maintain cooperative effort","d":["To assign all tasks","To assess individual performance only","To lecture on the topic"]},{"c":3,"g":"coop-approaches","q":"What is cooperative scripting (Dansereau, 1988)?","a":"Students work in reciprocal PAIRS taking turns summarising information and orally presenting it to each other","d":["Students work in groups of four on a project","One older student tutors a younger one","Students write scripts for a class drama"]},{"c":3,"g":"coop-approaches","q":"In cooperative scripting, what does the listening member do?","a":"Listens, monitors the presentation for mistakes and gives feedback — then becomes the teacher","d":["Takes notes silently","Grades the presenter","Waits for the teacher's summary"]},{"c":3,"g":"grouping","q":"Which grouping is BEST recommended for cooperative learning?","a":"Heterogeneous groups with diversity in ability, socio-economic status and gender","d":["Homogeneous groups of equal ability","Groups sorted by gender","Groups of high achievers only"]},{"c":3,"g":"grouping","q":"Why are heterogeneous groups recommended?","a":"To maximise the opportunity for tutoring and support, and to ensure each group has at least one student who can do the work","d":["To make marking easier","To reduce noise in class","To ensure equal group sizes"]},{"c":3,"g":"grouping","q":"What is the main benefit of heterogeneous grouping for low-ability students?","a":"They can learn from higher-ability students, who often assume the role of 'teacher'","d":["They are given easier work","They are graded separately","They work independently"]},{"c":3,"g":"grouping","q":"What is a stated problem with heterogeneous grouping?","a":"MEDIUM-ability students can get left out, as high- and low-ability students form a teacher-student relationship","d":["High-ability students learn nothing","Low-ability students dominate","Groups become too large"]},{"c":3,"g":"grouping","q":"Where may medium-ability students perform better?","a":"In groups where most or all students have medium ability","d":["In heterogeneous groups","In groups with high-ability students only","Working alone"]},{"c":3,"g":"grouping","q":"What does team-building in cooperative learning involve?","a":"Starting team-building at the beginning of term, helping students become better listeners, discussing the value of a team leader, and working with team leaders on problem situations","d":["Assigning students to fixed groups permanently","Grading students individually only","Rotating group membership weekly"]},{"c":4,"g":"cm-concept","q":"What is classroom management?","a":"Managing the classroom or school resources — both human and material — to ensure an effective teaching and learning process","d":["Enforcing school rules and punishing offenders","Preparing lesson notes and schemes of work","Assessing pupils' performance"]},{"c":4,"g":"cm-concept","q":"What do the resources in classroom management comprise?","a":"Both human (students) and material resources (tables, chairs, teaching aids, etc.)","d":["Only teaching and learning materials","Only the furniture and building","Only the students"]},{"c":4,"g":"cm-concept","q":"In recent times, what is the focus of classroom management geared towards?","a":"Guiding students to become more proficient at SELF-DISCIPLINE, rather than applying rules and regulations to control behaviour","d":["Stricter enforcement of classroom rules","Punishing misbehaviour promptly","Removing disruptive students"]},{"c":4,"g":"cm-concept","q":"What is the established relationship between effective teaching and classroom management?","a":"They are POSITIVELY related — good classroom management skills can predict the effectiveness of one's teaching","d":["They are negatively related","They are unrelated","Classroom management reduces teaching time"]},{"c":4,"g":"ryan-cooper","q":"Who defined the role of the teacher along six broad lines?","a":"Ryan and Cooper (1975)","d":["Santrock (2001)","Evertson and Emmer","Campbell et al (1973)"]},{"c":4,"g":"ryan-cooper","q":"Name the six roles of the teacher according to Ryan and Cooper (1975).","a":"A mediator of learning; a disciplinarian; a parent substitute; a judge; a confidant; and a surrogate of a specific value system","d":["Facilitator, leader, specialist, supporter, provider and mentor","Planner, organiser, coordinator, controller, reporter and budgeter","Teacher, assessor, counsellor, administrator, planner and communicator"]},{"c":4,"g":"ryan-cooper","q":"Which Ryan and Cooper role means the teacher passes judgement on pupils' work and conduct?","a":"A judge","d":["A disciplinarian","A confidant","A mediator of learning"]},{"c":4,"g":"ryan-cooper","q":"Which Ryan and Cooper role means the teacher acts 'in loco parentis'?","a":"A parent substitute","d":["A judge","A confidant","A disciplinarian"]},{"c":4,"g":"teacher-roles","q":"Under which headings may the teacher's classroom role be classified?","a":"Instruction; evaluating student achievement; administration; relationship with students; and guidance and counselling","d":["Teaching, marking, disciplining and reporting","Planning, organising, staffing and directing","Facilitating, mentoring, assessing and supervising"]},{"c":4,"g":"admin-role","q":"Which administrative role involves setting objectives and procedures, preparing lesson notes, and managing student behaviour?","a":"Planning","d":["Organisation","Coordinating","Policy-making"]},{"c":4,"g":"admin-role","q":"Which administrative role involves making decisions on resources, teaching strategies and discipline?","a":"Policy-making (decision-making)","d":["Planning","Coordinating","Organisation"]},{"c":4,"g":"admin-role","q":"Which administrative role involves classroom arrangement and grouping of students?","a":"Organisation","d":["Planning","Coordinating","Management of facilities"]},{"c":4,"g":"admin-role","q":"Which administrative role ensures classroom activities do not conflict with other school activities, e.g. school assembly?","a":"Coordinating","d":["Organisation","Planning","Student control"]},{"c":4,"g":"admin-role","q":"Which administrative role requires the teacher to learn the correct method of operation and care of equipment?","a":"Management of facilities","d":["Organisation","Student control","Planning"]},{"c":4,"g":"admin-role","q":"Which administrative role relates to the teacher acting 'in loco parentis' to develop behaviour patterns in the child?","a":"Student control","d":["Student data","Guidance and counselling","Coordinating"]},{"c":4,"g":"admin-role","q":"Which administrative role involves the collection, recording, filing and utilisation of data about individual students?","a":"Student data","d":["Communication","Organisation","Planning"]},{"c":4,"g":"admin-role","q":"Which administrative role involves the teacher drawing a scheme of work from the syllabus?","a":"Interpreting the syllabus","d":["Planning","Organisation","Policy-making"]},{"c":4,"g":"admin-role","q":"Which body prepares the curricula that reach schools in the form of syllabuses?","a":"The National Council for Curriculum and Assessment (NaCCA)","d":["NaSIA","The NTC","WAEC"]},{"c":4,"g":"admin-role","q":"Why are timetables essential?","a":"They ensure each subject receives its due share of instructional time and allot each activity the most suitable time of day","d":["They keep teachers busy","They satisfy inspection requirements","They help the head teacher monitor teachers"]},{"c":4,"g":"principles-instr","q":"How many principles of effective instruction are listed?","a":"Seven","d":["Five","Six","Eight"]},{"c":4,"g":"principles-instr","q":"Which principle of effective instruction consists of the modification or adaptation a teacher makes to suit students and the school environment?","a":"The principle of selection","d":["The principle of objectives","The principle of activity","The principle of interest"]},{"c":4,"g":"principles-instr","q":"Which principle of effective instruction makes students aware of the aims and objectives of what is being learned?","a":"The principle of objectives","d":["The principle of selection","The principle of activity","The principle of correlation"]},{"c":4,"g":"principles-instr","q":"Which principle of effective instruction makes the learner actively involved and ultimately self-reliant?","a":"The principle of activity","d":["The principle of interest","The principle of repetition","The principle of selection"]},{"c":4,"g":"principles-instr","q":"Under the principle of interest, what is the teacher's responsibility?","a":"NOT to create interest, but to DIRECT (redirect) interest","d":["To create interest where none exists","To ignore inattentive pupils","To punish lack of interest"]},{"c":4,"g":"principles-instr","q":"Which principle of effective instruction requires teachers to plan so each learner works at a level commensurate with his capability?","a":"The principle of individual teaching","d":["The principle of activity","The principle of selection","The principle of correlation"]},{"c":4,"g":"principles-instr","q":"Which principle of effective instruction gives learners continuous practice to lay a solid foundation for higher tasks?","a":"The principle of repetition","d":["The principle of activity","The principle of interest","The principle of correlation"]},{"c":4,"g":"principles-instr","q":"Which principle of effective instruction says every teaching unit designed should be part of the whole, not isolated?","a":"The principle of correlation","d":["The principle of repetition","The principle of selection","The principle of objectives"]},{"c":4,"g":"attention","q":"Which strategy helps students pay attention in class?","a":"Use cues or gestures to signal that something is important","d":["Speak in a monotone to avoid distraction","Give as much information as possible","Call only on high-achieving students"]},{"c":4,"g":"attention","q":"Which strategy helps students pay attention in class?","a":"Help students generate their own cue or catch phrase, such as 'Alert', 'Focus' or 'Zero in'","d":["Punish students who lose attention","Reduce classroom lighting","Extend lesson length"]},{"c":4,"g":"attention","q":"Why should teachers avoid overloading students with too much information?","a":"Because students given too much information too fast might not attend to anything","d":["Because it takes too long to prepare","Because the syllabus is short","Because it makes marking difficult"]},{"c":4,"g":"attention","q":"Which disorder is mentioned as causing severe problems in paying attention?","a":"Attention Deficit Hyperactivity Disorder (ADHD)","d":["Dyslexia","Autism","Dyscalculia"]},{"c":4,"g":"attention","q":"To maintain attention, what pattern of calling on students should be avoided?","a":"Focusing on and calling on particular students, e.g. only high achievers or only boys","d":["Calling on students at random","Calling on every student equally","Calling on volunteers"]},{"c":4,"g":"attention","q":"In maintaining attention, what does 'random' mean?","a":"That each student has an EQUAL chance of being called on","d":["That the teacher calls on nobody","That students choose when to answer","That only volunteers are called"]},{"c":4,"g":"memory","q":"Which strategy best helps students REMEMBER material over the long term?","a":"Motivate them to remember by UNDERSTANDING it rather than rotely memorising it","d":["Rehearsing it repeatedly","Writing it out several times","Testing them daily"]},{"c":4,"g":"memory","q":"Rehearsal works well for encoding information into which type of memory?","a":"Short-term memory","d":["Long-term memory","Sensory memory","Working memory only"]},{"c":4,"g":"memory","q":"How should students be assisted to ORGANISE what they put into memory?","a":"By organising it hierarchically, e.g. using concept mapping","d":["By writing it alphabetically","By memorising it in order","By reading it aloud"]},{"c":4,"g":"memory","q":"What are mnemonic strategies?","a":"Memory aids for remembering information, which can involve imagery and words","d":["Techniques for testing memory","Methods of organising a classroom","Approaches to lesson planning"]},{"c":4,"g":"memory","q":"'Thirty days hath September, April, June and November' is an example of which mnemonic type?","a":"Rhymes","d":["Acronyms","Imagery","Concept mapping"]},{"c":4,"g":"memory","q":"Why should students be encouraged to ask themselves questions about what they have read?","a":"Because it expands the number of associations they make with the information they need to retrieve","d":["Because it fills lesson time","Because it improves handwriting","Because it makes them read faster"]},{"c":4,"g":"memory","q":"By which level can the self-questioning strategy help students remember?","a":"At least by the JSS/JHS level","d":["By primary 1","Only at SHS level","Only at tertiary level"]},{"c":4,"g":"disturbance","q":"Which teacher factor causes classroom disturbance when a teacher punishes one student for disrespect but not others?","a":"Teacher's unfairness","d":["Teacher's inconsistency","Teacher's failure to establish routine","Teacher's inadequate knowledge"]},{"c":4,"g":"disturbance","q":"Which teacher factor arises when a teacher punishes talking one day then ignores it the next?","a":"Teacher's inconsistency","d":["Teacher's unfairness","Teacher's failure to establish routine","Inability to control temper"]},{"c":4,"g":"disturbance","q":"What is described as the teacher's BEST SAFEGUARD against indiscipline?","a":"Routine","d":["Punishment","Fairness","Subject mastery"]},{"c":4,"g":"disturbance","q":"Which teacher factor causes students to make a mockery of the teacher and lose respect?","a":"Teacher's inadequate knowledge of subject matter/content","d":["Teacher's unfairness","Teacher's inconsistency","Teacher's inability to control temper"]},{"c":4,"g":"disturbance","q":"Which teacher factor arises from interpreting classroom challenges personally?","a":"Teacher's inability to control his/her temper","d":["Teacher's unfairness","Teacher's inconsistency","Failure to establish routine"]},{"c":4,"g":"new-term","q":"Why are the first few days and weeks of a school term important?","a":"They are used to communicate rules and procedures, gain cooperation, and get students effectively engaged in learning activities","d":["They are used for revision of last term's work","They are used for assessment of pupils","They are used for stocktaking"]},{"c":4,"g":"new-term","q":"Which strategy is recommended for a good beginning of the school year?","a":"Make sure that students experience SUCCESS","d":["Set very difficult first tasks","Withhold rules until later","Avoid being visible in the first weeks"]},{"c":4,"g":"new-term","q":"Why must a teacher 'be in charge' even after stating rules clearly?","a":"Because some students will forget and others will test whether the teacher is willing to enforce the rules","d":["Because rules change frequently","Because parents expect it","Because the head teacher requires it"]},{"c":4,"g":"rules","q":"Which is a condition for establishing effective classroom rules?","a":"Establish the rules TOGETHER with students","d":["The teacher should set all rules alone","Rules should be kept private","Rules should be changed weekly"]},{"c":4,"g":"rules","q":"Which is a condition for establishing effective classroom rules?","a":"The rules should be clearly written down where every member of the class can see and read them","d":["Rules should be memorised only","Rules should be kept in the teacher's file","Rules should be posted in the staff room"]},{"c":4,"g":"rules","q":"What must be clearly stated and agreed upon regarding each classroom rule?","a":"The consequence for breaching it","d":["The reward for keeping it","The date it was made","Who suggested it"]},{"c":4,"g":"cooperation","q":"How many main strategies for getting students to cooperate does Santrock (2001) suggest?","a":"Three","d":["Two","Four","Five"]},{"c":4,"g":"cooperation","q":"Name Santrock's three strategies for getting students to cooperate.","a":"Develop a positive relationship with students; get students to share and assume responsibility; and reward appropriate behaviour","d":["Set rules, enforce them and punish offenders","Plan, organise and evaluate","Praise, reward and correct"]},{"c":4,"g":"cooperation","q":"According to Emmer and Anderson, what did successful classroom managers show?","a":"A caring attitude towards students","d":["A strict disciplinary approach","A distant professional manner","A focus on academic results only"]},{"c":4,"g":"cooperation","q":"Rewards should be used to provide what?","a":"Information about MASTERY, not to control students' behaviour","d":["Control over students' behaviour","Motivation to compete","Evidence for reports"]},{"c":4,"g":"cooperation","q":"Why are rewards used to CONTROL behaviour less desirable?","a":"They are less likely to promote self-regulation and responsibility","d":["They cost more money","They take more time","They are harder to administer"]},{"c":4,"g":"interventions","q":"Which classroom management experts distinguish between minor and moderate interventions?","a":"Carolyn Evertson and colleagues","d":["Santrock and colleagues","Emmer and Anderson","Slavin and Johnson"]},{"c":4,"g":"interventions","q":"A student leaving their seat without permission calls for which type of intervention?","a":"A minor intervention","d":["A moderate intervention","A major intervention","Referral to the head teacher"]},{"c":4,"g":"interventions","q":"Which is a MINOR intervention for problem behaviour?","a":"Use nonverbal cues — establish eye contact, place a finger on the lips, shake the head","d":["Create a behaviour contract","Isolate or remove the student","Withhold a privilege"]},{"c":4,"g":"interventions","q":"Which minor intervention addresses misbehaviour caused by students not understanding the task?","a":"Give needed instructions","d":["Use nonverbal cues","Directly and assertively tell the student to stop","Isolate the student"]},{"c":4,"g":"interventions","q":"Which is a MODERATE intervention for problem behaviour?","a":"Withhold a privilege or desired activity","d":["Use nonverbal cues","Give needed instructions","Establish eye contact"]},{"c":4,"g":"interventions","q":"Name the three moderate interventions (Evertson, Emmer and Worsham, 2000).","a":"Withhold a privilege or desired activity; create a behaviour contract; isolate or remove the student","d":["Nonverbal cues, needed instructions and assertive telling","Warning, query and suspension","Detention, extra work and parental notice"]},{"c":4,"g":"interventions","q":"Who can be used as resources to help students behave appropriately (Santrock, 2001)?","a":"Peers, parents, the head teacher and the school counsellor","d":["Only the head teacher","Only the parents","Only the district director"]},{"c":4,"g":"kg-corners","q":"How many corners should a KG classroom have?","a":"Four","d":["Three","Five","Six"]},{"c":4,"g":"kg-corners","q":"At which KG corner do children play with trays of sand by scribbling, drawing or tracing?","a":"The sandy corner","d":["The shopping corner","The make-believe corner","The nature corner"]},{"c":4,"g":"kg-corners","q":"What does the sandy corner prepare KG children for?","a":"Manipulating their wrist in preparation for proper writing","d":["Learning arithmetic","Learning to communicate orally","Admiring nature"]},{"c":4,"g":"kg-corners","q":"At which KG corner do children learn to buy and sell, indirectly learning arithmetic, language and gestures?","a":"The shopping corner","d":["The sandy corner","The make-believe corner","The nature corner"]},{"c":4,"g":"kg-corners","q":"Which KG corner has toys and pictures of professionals like nurses, doctors, farmers and policemen?","a":"The make-believe corner","d":["The shopping corner","The nature corner","The sandy corner"]},{"c":4,"g":"kg-corners","q":"What do children learn at the make-believe corner?","a":"How to communicate orally, by imitating professionals and family members","d":["Arithmetic through buying and selling","Wrist control for writing","Appreciation of nature"]},{"c":4,"g":"kg-corners","q":"Which KG corner has nests of birds, feathers, stones, beehives, horns and skeletons of animals?","a":"The nature corner","d":["The make-believe corner","The shopping corner","The sandy corner"]},{"c":4,"g":"seven-principles","q":"Which teaching principle says to master the act of sharing knowledge from simple to complex?","a":"Proceed from simple to complex","d":["Proceed from known to unknown","Proceed from part to whole","Proceed from particular to general"]},{"c":4,"g":"seven-principles","q":"Which teaching principle uses the learner's previous knowledge to build the new?","a":"Proceed from known to unknown","d":["Proceed from simple to complex","Proceed from part to whole","Proceed from particular to general"]},{"c":4,"g":"seven-principles","q":"Which teaching principle means breaking lessons into smaller units before reaching the full?","a":"Proceed from part to whole","d":["Proceed from simple to complex","Proceed from known to unknown","Proceed from particular to general"]},{"c":4,"g":"seven-principles","q":"Which teaching principle uses real-life examples that connect to general knowledge, and relates to INDUCTIVE reasoning?","a":"Proceed from particular to general","d":["Proceed from part to whole","Proceed from simple to complex","Proceed from known to unknown"]},{"c":4,"g":"seven-principles","q":"Which teaching principle says teachers should connect with learners in the classroom and use feedback to know where they stand?","a":"Do not teach in isolation","d":["Motivate learners to learn","Teach to learners' individual differences","Proceed from known to unknown"]},{"c":4,"g":"seven-principles","q":"Which teaching principle recognises that there are fast and slow learners?","a":"Teach to learners' individual differences","d":["Do not teach in isolation","Motivate learners to learn","Proceed from simple to complex"]},{"c":4,"g":"seven-principles","q":"Under 'teach to learners' individual differences', what should teachers know about learners?","a":"Their physical characteristics, intelligence, gender, ability and learning styles","d":["Their family background and religion only","Their examination results only","Their attendance record only"]},{"c":5,"g":"leadership-def","q":"According to Astin and Leland (1991), leadership is what?","a":"A process by which members of a group are empowered to work together synergistically towards a common goal or vision that will create change, transform institutions and improve the quality of life","d":["The force by which an individual exerts influence in releasing, channelling and controlling thoughts","The professional practice of guiding educators towards improving learning","The operation of educational organisations"]},{"c":5,"g":"leadership-def","q":"According to Gardner (1995), leaders are who?","a":"Individuals who affect the thoughts, feelings and behaviours of a significant number of individuals","d":["Individuals appointed by law to head institutions","Persons who inherit authority by lineage","Persons with charisma and personal trust"]},{"c":5,"g":"leadership-def","q":"Gardner says a leader must be an educator, bridging the gap between what?","a":"The vision and the familiar","d":["The policy and the practice","The staff and the students","The past and the future"]},{"c":5,"g":"leadership-def","q":"How is educational leadership defined?","a":"The process of enlisting and guiding the talents and energies of teachers, pupils and parents towards achieving common educational goals","d":["The management of institutions designed to foster teaching and learning","The field of study concerned with the operations of educational organisations","The exercise of legal authority over a school"]},{"c":5,"g":"leadership-def","q":"'Educational leadership' has supplanted which term in the United Kingdom?","a":"Educational management","d":["Educational administration","School supervision","Instructional leadership"]},{"c":5,"g":"ways-leadership","q":"What
