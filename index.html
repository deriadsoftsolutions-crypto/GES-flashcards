e SHS","d":["Yes, if they have five years' experience","Yes, in any subject","Yes, only in core subjects"]},{"c":5,"g":"latest-admin","q":"Does the mode of education (regular, sandwich or distance) affect eligibility to teach at SHS?","a":"No — obtaining a degree in a respective field has nothing to do with the mode of education","d":["Yes, only regular degrees count","Yes, sandwich degrees are excluded","Yes, distance degrees are excluded"]},{"c":5,"g":"latest-admin","q":"How is the 10 days of casual leave distributed across the three terms?","a":"3 : 3 : 4 for first, second and third term","d":["4 : 3 : 3","3 : 4 : 3","Equally, 3.3 days per term"]},{"c":5,"g":"latest-admin","q":"Can a teacher be given the full 10 days of casual leave in one term?","a":"No — unless it is a critical moment","d":["Yes, on request","Yes, with the head teacher's approval","Yes, in the third term only"]},{"c":5,"g":"latest-admin","q":"Who will be DENIED casual leave under the latest GES administration?","a":"Teachers with poor performance in terms of attendance","d":["Teachers on probation","Newly posted teachers","Teachers pursuing further studies"]},{"c":5,"g":"latest-admin","q":"How many weeks of maternity leave are allotted to nursing mothers?","a":"12 weeks","d":["10 weeks","14 weeks","16 weeks"]},{"c":5,"g":"latest-admin","q":"How many ADDITIONAL weeks of maternity leave are given for twins?","a":"2 weeks","d":["4 weeks","1 week","3 weeks"]},{"c":5,"g":"latest-admin","q":"What is required for an extension of maternity leave days in an emergency?","a":"A medical report","d":["A letter from the head teacher","Approval from the district director","A police report"]},{"c":5,"g":"latest-admin","q":"How many days off do legitimate husbands get to take care of the wife after delivery?","a":"5 days","d":["3 days","7 days","10 days"]},{"c":5,"g":"latest-admin","q":"Under the latest GES administration, who approves ALL promotions?","a":"The Director-General of GES","d":["The Regional Director","The District Director","The GES Council"]},{"c":5,"g":"latest-admin","q":"What has been abolished under the latest promotions policy?","a":"Mass promotion where all teachers are promoted to SS I","d":["Promotion by examination","Promotion by interview","Promotion of non-graduates"]},{"c":5,"g":"latest-admin","q":"What four things are looked for in promotions under the latest GES administration?","a":"Attendance; output of work; involvement in co-curricular activities; and lesson notes preparation","d":["Qualification, experience, seniority and conduct","Examination result, interview, appraisal and attendance","Attendance, punctuality, discipline and results"]},{"c":5,"g":"latest-admin","q":"Under validation rules, what happens to teachers who absent themselves without written permission?","a":"They should be validated with issues; the Controller will effect deductions","d":["They are automatically dismissed","They receive a written warning only","Their salary is suspended entirely"]},{"c":5,"g":"latest-admin","q":"What happens to a validator who covers up for a teacher?","a":"He/she will be sanctioned, and the teacher affected will also pay for the days absent plus other penalties","d":["Only the teacher is penalised","Only the validator is warned","The matter is referred to the DDC"]},{"c":5,"g":"latest-admin","q":"How should transferred teachers be treated on the payroll?","a":"They should be added as missing staff and see the IPPD Coordinator for transfer of management unit","d":["They should open a new payroll file","They should be paid by the receiving district directly","They should wait for the next validation"]},{"c":5,"g":"latest-admin","q":"Under the latest policy, when will transfers and re-posting take place?","a":"Not until the office gets a new teacher for replacement","d":["At the end of every academic year","On request at any time","Only during the long vacation"]},{"c":5,"g":"latest-admin","q":"How should the revision week be used?","a":"It should be utilised well so it does not go to waste — teaching must go on","d":["It should be used for staff meetings","It should be a break for teachers","It should be used for examinations only"]},{"c":5,"g":"latest-admin","q":"When should the beginning-of-term staff meeting be held?","a":"On Monday, a day before reopening","d":["On the first day of reopening","At the end of the first week","On the last day of the previous term"]},{"c":6,"g":"assessment-def","q":"What is assessment?","a":"The process of obtaining information used for making decisions about students, curricula and programmes","d":["The process of attaching numbers to behaviour or performance","The process of making a value judgement about effectiveness","A device used to measure behaviour for a specific purpose"]},{"c":6,"g":"assessment-def","q":"Which authors defined assessment as 'a process for obtaining information used for making decisions about students, curricula, programmes and educational policy'?","a":"Amedahe and Asamoah-Gyimah (2019)","d":["Bloom (1956)","Driscoll (2005)","Campbell et al (1973)"]},{"c":6,"g":"assessment-def","q":"Assessment procedures may be formal or informal — give an example of each.","a":"Formal: pen-and-paper tests. Informal: observation","d":["Formal: observation. Informal: written tests","Formal: interviews. Informal: examinations","Formal: projects. Informal: tests"]},{"c":6,"g":"assessment-purpose","q":"Which is a purpose of assessment?","a":"For instructional management decisions","d":["For payroll validation","For staff appraisal","For school inspection"]},{"c":6,"g":"assessment-purpose","q":"Which is a purpose of assessment?","a":"For placement decisions","d":["For budgeting decisions","For infrastructure planning","For staff recruitment"]},{"c":6,"g":"assessment-principles","q":"Which is a principle of assessment?","a":"Select an assessment procedure which is most relevant to the purpose","d":["Use only one assessment procedure","Assess everything at the end of the year","Keep assessment results confidential from students"]},{"c":6,"g":"assessment-principles","q":"Which principle of assessment warns against treating assessment as the goal itself?","a":"Assessment is a MEANS to an end, and not an end in itself","d":["Specify what is to be assessed","Be aware of the limitations of the procedure","Use a variety of procedures"]},{"c":6,"g":"assessment-principles","q":"Why should a variety of assessment procedures be used?","a":"To obtain comprehensive information on the students","d":["To keep students busy","To satisfy inspection requirements","To reduce marking time"]},{"c":6,"g":"assessment-types","q":"Which type of assessment occurs at the END of the year or at key stages and is SUMMATIVE?","a":"Assessment OF learning","d":["Assessment AS learning","Assessment FOR learning","Continuous assessment"]},{"c":6,"g":"assessment-types","q":"Which type of assessment involves SELF and PEER assessment, helping students become aware of how they learn?","a":"Assessment AS learning","d":["Assessment OF learning","Assessment FOR learning","Diagnostic assessment"]},{"c":6,"g":"assessment-types","q":"Which type of assessment is ongoing, diagnostic and formative, and is NOT used for grading?","a":"Assessment FOR learning","d":["Assessment OF learning","Assessment AS learning","Summative assessment"]},{"c":6,"g":"assessment-types","q":"Which type of assessment is associated with letter grades or numbers, e.g. report cards?","a":"Assessment OF learning","d":["Assessment AS learning","Assessment FOR learning","Diagnostic assessment"]},{"c":6,"g":"assessment-types","q":"In which type of assessment do teachers investigate what students know, and what confusions, preconceptions or gaps they have?","a":"Assessment FOR learning","d":["Assessment OF learning","Assessment AS learning","Norm-referenced assessment"]},{"c":6,"g":"continuous","q":"What is continuous assessment?","a":"The formative evaluation procedure that systematically finds out the overall gains students have made in attitudes, values, skills, abilities and knowledge","d":["An end-of-course examination","A single test given each term","A comparison of pupils in the same class"]},{"c":6,"g":"continuous-chars","q":"Which characteristic of continuous assessment means the final grade is the SUM of all marks attained throughout the programme?","a":"It is cumulative","d":["It is formative","It is systematic","It is comprehensive"]},{"c":6,"g":"continuous-chars","q":"Which characteristic of continuous assessment involves breaking instruction into small units, teaching, assessing, and re-teaching if not mastered?","a":"It is formative","d":["It is cumulative","It is systematic","It is guidance-oriented"]},{"c":6,"g":"continuous-chars","q":"Which characteristic of continuous assessment means information is collected in an ORDERLY manner, with teacher and learners knowing the volume of information to be collected?","a":"It is systematic","d":["It is cumulative","It is formative","It is comprehensive"]},{"c":6,"g":"continuous-chars","q":"Which characteristic of continuous assessment helps an individual know his strengths and weaknesses and develop talents?","a":"It is guidance-oriented","d":["It is cumulative","It is systematic","It is formative"]},{"c":6,"g":"continuous-chars","q":"Which characteristic of continuous assessment means it covers the cognitive, affective and psychomotor domains?","a":"It is comprehensive","d":["It is cumulative","It is systematic","It is guidance-oriented"]},{"c":6,"g":"measurement","q":"What is measurement?","a":"The process of systematically quantifying or attaching NUMBERS to behaviour or performance, e.g. awarding marks","d":["Making a value judgement about effectiveness","Obtaining information for making decisions","Using a device to test behaviour"]},{"c":6,"g":"measurement","q":"Name the four general scales of measurement.","a":"Nominal, ordinal, interval and ratio","d":["Nominal, cardinal, interval and ratio","Ordinal, interval, ratio and percentage","Nominal, ordinal, discrete and continuous"]},{"c":6,"g":"measurement","q":"What is evaluation?","a":"Gathering information on a person, programme or process and making a VALUE JUDGEMENT about the effectiveness of what is being evaluated","d":["Attaching numbers to performance","Obtaining information for decisions","Administering a test"]},{"c":6,"g":"measurement","q":"Awarding a score of 90% AND remarking 'Excellent' is an example of what?","a":"Evaluation (making a judgement against a standard)","d":["Measurement only","Assessment only","Testing only"]},{"c":6,"g":"measurement","q":"Determining the weight of a man as 78.8kg is an example of what?","a":"Measurement","d":["Evaluation","Assessment","Testing"]},{"c":6,"g":"measurement","q":"Are measurement and evaluation the same thing?","a":"No — they are often used interchangeably yet they are NOT the same, though related","d":["Yes, they are identical","Yes, evaluation is a type of measurement","No, they are entirely unrelated"]},{"c":6,"g":"me-importance","q":"Which is an importance of measurement and evaluation?","a":"It exposes the strengths and weaknesses in learning","d":["It reduces the workload of teachers","It satisfies parents' curiosity","It fulfils inspection requirements"]},{"c":6,"g":"me-importance","q":"Which is an importance of measurement and evaluation?","a":"It helps to determine the extent to which educational goals are being achieved","d":["It determines teachers' promotion","It sets the school budget","It selects the curriculum"]},{"c":6,"g":"eval-types","q":"Which type of evaluation is also known as PLACEMENT evaluation?","a":"Predictive evaluation","d":["Diagnostic evaluation","Summative evaluation","Formative evaluation"]},{"c":6,"g":"eval-types","q":"Aptitude tests and entrance examinations are examples of which evaluation type?","a":"Predictive evaluation","d":["Diagnostic evaluation","Summative evaluation","Formative evaluation"]},{"c":6,"g":"eval-types","q":"Which type of evaluation identifies the strengths and weaknesses of pupils to find out what further teaching is necessary?","a":"Diagnostic evaluation","d":["Predictive evaluation","Summative evaluation","Formative evaluation"]},{"c":6,"g":"eval-types","q":"Which type of evaluation is carried out at the END of a course to find out the extent to which instructional objectives have been achieved?","a":"Summative evaluation","d":["Formative evaluation","Diagnostic evaluation","Predictive evaluation"]},{"c":6,"g":"eval-types","q":"Which type of evaluation is carried out AS instruction progresses, so instruction can be adapted to pupils' level and needs?","a":"Formative evaluation","d":["Summative evaluation","Diagnostic evaluation","Predictive evaluation"]},{"c":6,"g":"eval-types","q":"Which evaluation assumption states that the teacher-student-material interaction has been conducive to learning?","a":"An assumption of summative evaluation","d":["An assumption of formative evaluation","An assumption of diagnostic evaluation","An assumption of predictive evaluation"]},{"c":6,"g":"test","q":"What is a test?","a":"Any device used to measure the behaviour of a person for a specific purpose","d":["A process of obtaining information for decisions","A value judgement on performance","The quantification of behaviour"]},{"c":6,"g":"test","q":"What are the two main categories of tests?","a":"Subjective (e.g. essay) and objective (e.g. true/false)","d":["Formative and summative","Norm-referenced and criterion-referenced","Diagnostic and predictive"]},{"c":6,"g":"test","q":"Which is a USE of a test?","a":"Selection and placement","d":["Payroll validation","Curriculum design","Staff appraisal"]},{"c":6,"g":"test","q":"Which is a TYPE of test?","a":"Criterion and Norm-Referenced Test","d":["Formative test","Cumulative test","Comprehensive test"]},{"c":6,"g":"reliability","q":"What is reliability?","a":"A test is reliable to the extent that it provides the SAME estimate of performance each time it is used","d":["A test measures what it is supposed to measure","A test compares pupils with each other","A test predicts future performance"]},{"c":6,"g":"reliability","q":"In a reliable classroom test, what happens on a second attempt?","a":"High-scoring individuals tend to score high again, and low-scoring persons tend to score low again","d":["All scores improve equally","Scores become more varied","Scores converge to the mean"]},{"c":6,"g":"reliability","q":"Reliability refers to the CONSISTENCY of assessment scores over what?","a":"Over TIME, on a population of individuals or groups","d":["Over different subject areas","Over different schools","Over different examiners only"]},{"c":6,"g":"validity","q":"What is validity?","a":"A test is valid if it tests what it is SUPPOSED to test — how well a test measures what it is intended to measure","d":["A test gives the same result each time","A test is easy to administer","A test compares pupils to a standard"]},{"c":6,"g":"validity","q":"What is the relationship between validity and reliability?","a":"For a test to be VALID it must necessarily be RELIABLE","d":["For a test to be reliable it must be valid","Validity and reliability are unrelated","A reliable test is always valid"]},{"c":6,"g":"validity","q":"A typing test with too short a time limit tests speed rather than comprehension. What does this make it?","a":"Not valid","d":["Not reliable","Both invalid and unreliable","Valid but unreliable"]},{"c":6,"g":"validity","q":"Name the three main types of validity EVIDENCE used in establishing assessment results.","a":"Content-related, criterion-related and construct-related validity evidence","d":["Content, predictive and concurrent","Content, construct and concurrent","Predictive, concurrent and construct"]},{"c":6,"g":"validity","q":"Which validity evidence relates to how adequately the CONTENT of a test samples the domain about which inferences are made?","a":"Content-related validity evidence","d":["Criterion-related validity evidence","Construct-related validity evidence","Concurrent validity"]},{"c":6,"g":"validity","q":"Sampling 100 words from a population of 500 and finding a Class 3 pupil can spell them all illustrates which validity?","a":"Content-related validity evidence","d":["Criterion-related validity","Construct-related validity","Predictive validity"]},{"c":6,"g":"validity","q":"Which validity evidence looks at how a test can be used to INFER or PREDICT an individual's standing on outcomes other than the assessment itself?","a":"Criterion-related validity evidence","d":["Content-related validity evidence","Construct-related validity evidence","Face validity"]},{"c":6,"g":"validity","q":"What are the two sub-categories of criterion-related validity?","a":"Predictive validity and concurrent validity","d":["Content and construct validity","Face and construct validity","Internal and external validity"]},{"c":6,"g":"validity","q":"Which validity uses a test to predict LATER performance, e.g. at the university level?","a":"Predictive validity","d":["Concurrent validity","Content validity","Construct validity"]},{"c":6,"g":"validity","q":"Which validity applies when data on test scores and criterion scores are collected at the SAME TIME?","a":"Concurrent validity","d":["Predictive validity","Content validity","Construct validity"]},{"c":6,"g":"validity","q":"Passing a paper-and-pencil driving test and being asked INSTANTLY to drive the car illustrates which validity?","a":"Concurrent validity","d":["Predictive validity","Content validity","Construct validity"]},{"c":6,"g":"construct","q":"What is a construct?","a":"A skill, attribute or ability based on one or more theories, existing in the human brain and not directly observable","d":["A test item measuring a specific skill","A criterion against which performance is judged","An observable behaviour"]},{"c":6,"g":"construct","q":"Which of these is an example of a construct?","a":"Intelligence, motivation or anxiety","d":["Height, weight or age","Marks, grades or scores","Attendance, punctuality or conduct"]},{"c":6,"g":"construct","q":"Which validity evidence refers to how well a test measures the construct it is designed to measure?","a":"Construct-related validity evidence","d":["Content-related validity evidence","Criterion-related validity evidence","Concurrent validity"]},{"c":6,"g":"scores","q":"What is the equation for an obtained score?","a":"Xi = Ti + Ei","d":["Xi = Ti − Ei","Ti = Xi + Ei","Ei = Xi + Ti"]},{"c":6,"g":"scores","q":"In the equation Xi = Ti + Ei, what does Ti represent?","a":"The TRUE score","d":["The obtained score","The error score","The total score"]},{"c":6,"g":"scores","q":"In the equation Xi = Ti + Ei, what does Ei represent?","a":"The ERROR score","d":["The estimated score","The expected score","The examination score"]},{"c":6,"g":"scores","q":"What is a TRUE score?","a":"That portion of the obtained score that remains when the error score is subtracted","d":["That portion that remains when the true score is subtracted","The sum of all correct answers","The average of repeated testing"]},{"c":6,"g":"scores","q":"What is an ERROR score?","a":"That portion of the obtained score that remains when the TRUE score is subtracted","d":["That portion remaining when the error score is subtracted","The number of wrong answers","The difference between two test scores"]},{"c":6,"g":"scores","q":"What is an obtained score?","a":"The sum of the number of correct/right answers from a selection test, or the sum of ratings from an open-ended task","d":["The score after error is removed","The average score of the class","The score converted to a grade"]},{"c":6,"g":"scores","q":"Does an obtained score contain errors?","a":"Yes — an obtained score contains errors","d":["No, it is the true score","Only in essay tests","Only in objective tests"]},{"c":6,"g":"cat","q":"Name the four principal stages in planning classroom tests.","a":"Constructing the test; administering the test; scoring the test; and analysing the test results","d":["Planning, writing, marking and reporting","Designing, piloting, administering and revising","Setting, moderating, administering and grading"]},{"c":6,"g":"cat","q":"Which of these must be considered in CONSTRUCTING a test?","a":"Define the purpose of the test","d":["Analyse item difficulty","Compute the mean score","Report results to parents"]},{"c":6,"g":"cat","q":"Which of these must be considered in constructing a test?","a":"Prepare the scoring/marking key","d":["Compute item discrimination","Rank students by score","Compare with other schools"]},{"c":6,"g":"item-analysis","q":"Which two concepts are examined when appraising classroom tests (item analysis)?","a":"Item difficulty and item discrimination","d":["Validity and reliability","Mean and standard deviation","Norm and criterion referencing"]},{"c":6,"g":"referencing","q":"What is norm-referenced interpretation of test scores?","a":"The performance of a pupil on a test compared to that of OTHER pupils in the same class","d":["Performance compared to a specific set of standards or criteria","Performance compared to the pupil's own past scores","Performance compared to the national average only"]},{"c":6,"g":"referencing","q":"'Ama is the best reader in her class' is an example of what?","a":"Norm-referenced interpretation","d":["Criterion-referenced interpretation","Formative assessment","Diagnostic evaluation"]},{"c":6,"g":"referencing","q":"'Afia performed better than Esi' is an example of what?","a":"Norm-referenced interpretation","d":["Criterion-referenced interpretation","Construct validity","Predictive validity"]},{"c":6,"g":"referencing","q":"What is a USE of norm-referenced interpretation?","a":"For selection and placement","d":["For diagnosing learning difficulties","For certifying mastery of a standard","For formative feedback"]},{"c":6,"g":"referencing","q":"What is criterion-referenced interpretation of test scores?","a":"Measuring a test-taker's performance against a specific set of standards, criteria or predetermined standard","d":["Comparing a pupil with other pupils in the class","Ranking pupils from best to worst","Comparing schools with each other"]},{"c":6,"g":"referencing","q":"'To obtain grade A in an exam a student must score 80%' is an example of what?","a":"Criterion-referenced interpretation","d":["Norm-referenced interpretation","Formative assessment","Predictive validity"]},{"c":6,"g":"taxonomy","q":"How many main taxonomies of educational objectives are there?","a":"Three","d":["Two","Four","Six"]},{"c":6,"g":"taxonomy","q":"Name the three taxonomies of educational objectives.","a":"Cognitive, Psychomotor and Affective domains","d":["Knowledge, Skills and Attitudes","Cognitive, Behavioural and Social","Thinking, Feeling and Doing"]},{"c":6,"g":"taxonomy","q":"Whose taxonomy deals with the cognitive, affective and psychomotor domains?","a":"Bloom's taxonomy","d":["Maslow's taxonomy","Gagne's taxonomy","Krathwohl's taxonomy"]},{"c":6,"g":"cognitive-domain","q":"How many levels or processes of complexity are in the cognitive domain?","a":"Six","d":["Five","Seven","Four"]},{"c":6,"g":"cognitive-domain","q":"Which cognitive level deals with the ability to REMEMBER previously learned material such as dates, definitions and facts?","a":"Knowledge","d":["Comprehension","Application","Analysis"]},{"c":6,"g":"cognitive-domain","q":"'Ghana gained her independence in 1957' tests which cognitive level?","a":"Knowledge","d":["Comprehension","Application","Evaluation"]},{"c":6,"g":"cognitive-domain","q":"Which cognitive level is the ability to state or write what someone else has said in a DIFFERENT WAY without distorting the meaning?","a":"Comprehension","d":["Knowledge","Application","Synthesis"]},{"c":6,"g":"cognitive-domain","q":"Rewriting 'the student went home without an exeat' as 'the student went home without permission' tests which cognitive level?","a":"Comprehension","d":["Knowledge","Analysis","Synthesis"]},{"c":6,"g":"cognitive-domain","q":"Which cognitive level is the USE of abstractions in particular and concrete situations?","a":"Application","d":["Comprehension","Analysis","Synthesis"]},{"c":6,"g":"cognitive-domain","q":"A student using knowledge of subtraction to give correct change to a customer tests which cognitive level?","a":"Application","d":["Comprehension","Knowledge","Analysis"]},{"c":6,"g":"cognitive-domain","q":"Which cognitive level is the ability to SEPARATE or break down materials into component parts so the organisational structure may be understood?","a":"Analysis","d":["Synthesis","Evaluation","Application"]},{"c":6,"g":"cognitive-domain","q":"'Distinguish between Measurement and Evaluation' tests which cognitive level?","a":"Analysis","d":["Comprehension","Synthesis","Evaluation"]},{"c":6,"g":"cognitive-domain","q":"Which cognitive level is PUTTING PARTS TOGETHER to form a whole?","a":"Synthesis","d":["Analysis","Evaluation","Application"]},{"c":6,"g":"cognitive-domain","q":"Organising the parts of a simple electrical circuit to produce light tests which cognitive level?","a":"Synthesis","d":["Analysis","Application","Evaluation"]},{"c":6,"g":"cognitive-domain","q":"Which cognitive level is making JUDGEMENT about the value of material based on personal values or opinions?","a":"Evaluation","d":["Synthesis","Analysis","Application"]},{"c":6,"g":"cognitive-domain","q":"Students examining two ways of solving simultaneous equations and justifying the correctness of each tests which cognitive level?","a":"Evaluation","d":["Synthesis","Analysis","Application"]},{"c":6,"g":"affective-domain","q":"What does the affective domain deal with?","a":"Our feelings, emotions and attitudes","d":["Motor skills and their coordination","Thinking and intellectual processes","Knowledge and comprehension"]},{"c":6,"g":"affective-domain","q":"How many sub-domains are in the affective domain?","a":"Five","d":["Six","Four","Seven"]},{"c":6,"g":"affective-domain","q":"Name the five sub-domains of the affective domain in order.","a":"Receiving phenomena, Responding, Valuing, Organisation and Characterisation","d":["Perception, Set, Guided response, Mechanism and Adaptation","Knowledge, Comprehension, Application, Analysis and Synthesis","Awareness, Interest, Attitude, Belief and Value"]},{"c":6,"g":"affective-domain","q":"Which affective sub-domain is the awareness of feelings and emotions and the ability to use selected attention?","a":"Receiving phenomena","d":["Responding to phenomena","Valuing","Organisation"]},{"c":6,"g":"affective-domain","q":"Listening attentively to a friend is an example of which affective sub-domain?","a":"Receiving phenomena","d":["Responding to phenomena","Valuing","Characterisation"]},{"c":6,"g":"affective-domain","q":"Which affective sub-domain is the ACTIVE PARTICIPATION of the learner?","a":"Responding to phenomena","d":["Receiving phenomena","Valuing","Organisation"]},{"c":6,"g":"affective-domain","q":"Participation in group discussions is an example of which affective sub-domain?","a":"Responding to phenomena","d":["Receiving phenomena","Valuing","Organisation"]},{"c":6,"g":"affective-domain","q":"Which affective sub-domain is the ability to see the WORTH of something and express it?","a":"Valuing","d":["Organisation","Characterisation","Responding"]},{"c":6,"g":"affective-domain","q":"An activist sharing his ideas on the increase in salary of labourers illustrates which affective sub-domain?","a":"Valuing","d":["Organisation","Characterisation","Responding"]},{"c":6,"g":"affective-domain","q":"Which affective sub-domain is the ability to PRIORITISE one value over another and create a unique value system?","a":"Organisation","d":["Valuing","Characterisation","Responding"]},{"c":6,"g":"affective-domain","q":"A teenager spending more time on her studies than with her boyfriend illustrates which affective sub-domain?","a":"Organisation","d":["Valuing","Characterisation","Receiving"]},{"c":6,"g":"affective-domain","q":"Which affective sub-domain is the ability to INTERNALISE values and let them control the person's behaviour?","a":"Characterisation","d":["Organisation","Valuing","Responding"]},{"c":6,"g":"psychomotor","q":"What does the psychomotor domain comprise?","a":"Utilising motor skills and coordinating them","d":["Feelings, emotions and attitudes","Thinking and intellectual processes","Values and belief systems"]},{"c":6,"g":"psychomotor","q":"How many categories are under the psychomotor domain?","a":"Seven","d":["Five","Six","Eight"]},{"c":6,"g":"psychomotor","q":"Which psychomotor category is the ability to apply SENSORY information to motor activity?","a":"Perception","d":["Set","Guided response","Mechanism"]},{"c":6,"g":"psychomotor","q":"A cook adjusting the heat of the stove to achieve the right temperature illustrates which psychomotor category?","a":"Perception","d":["Set","Guided response","Mechanism"]},{"c":6,"g":"psychomotor","q":"Which psychomotor category is the READINESS to act?","a":"Set","d":["Perception","Guided response","Mechanism"]},{"c":6,"g":"psychomotor","q":"An obese person displaying motivation in performing planned exercises illustrates which psychomotor category?","a":"Set","d":["Perception","Guided response","Adaptation"]},{"c":6,"g":"psychomotor","q":"Which psychomotor category is the ability to IMITATE a displayed behaviour or use trial and error to succeed?","a":"Guided response","d":["Set","Mechanism","Perception"]},{"c":6,"g":"psychomotor","q":"A person following a manual to operate a machine illustrates which psychomotor category?","a":"Guided response","d":["Mechanism","Set","Perception"]},{"c":6,"g":"psychomotor","q":"Which psychomotor category is the ability to convert learned responses into HABITUAL actions with proficiency and confidence?","a":"Mechanism","d":["Guided response","Complex overt response","Adaptation"]},{"c":6,"g":"psychomotor","q":"The ability to operate a gadget WITHOUT the help of a manual illustrates which psychomotor category?","a":"Mechanism","d":["Guided response","Adaptation","Origination"]},{"c":6,"g":"psychomotor","q":"Which psychomotor category is the ability to SKILFULLY perform complex patterns of action?","a":"Complex overt response","d":["Mechanism","Adaptation","Origination"]},{"c":6,"g":"psychomotor","q":"Typing a report on a computer without looking at the keyboard illustrates which psychomotor category?","a":"Complex overt response","d":["Mechanism","Adaptation","Origination"]},{"c":6,"g":"psychomotor","q":"Which psychomotor category is the ability to MODIFY learned skills to meet special events?","a":"Adaptation","d":["Origination","Complex overt response","Mechanism"]},{"c":6,"g":"psychomotor","q":"A designer using plastic bottles to create a beautiful dress illustrates which psychomotor category?","a":"Adaptation","d":["Origination","Complex overt response","Mechanism"]},{"c":6,"g":"psychomotor","q":"Which psychomotor category is CREATING NEW movement patterns for a specific situation?","a":"Origination","d":["Adaptation","Complex overt response","Mechanism"]},{"c":6,"g":"psychomotor","q":"A choreographer creating a new dance routine illustrates which psychomotor category?","a":"Origination","d":["Adaptation","Complex overt response","Guided response"]},{"c":7,"g":"framework","q":"What does the School Curriculum Framework comprise?","a":"A set of interlocking components including essential learning experiences, generic skills, values and attitudes, and key learning areas","d":["Objectives, content, methods and evaluation","Syllabuses, textbooks and teacher handbooks","Aims, goals, objectives and outcomes"]},{"c":7,"g":"framework","q":"What does the curriculum framework set out?","a":"What students should know, value and be able to do at the various stages of schooling","d":["The order in which subjects are taught","The number of contact hours per subject","The rules governing assessment"]},{"c":7,"g":"framework","q":"What is a standards-based curriculum?","a":"A body of knowledge and set of competencies that form the basis for a quality education, defining what students should know, understand and be able to do","d":["A list of topics to be covered each term","A collection of syllabuses and textbooks","A set of examination requirements"]},{"c":7,"g":"core-competences","q":"How many core competences does the curriculum identify?","a":"Six","d":["Four","Five","Seven"]},{"c":7,"g":"core-competences","q":"Name the six core competences of the standards-based curriculum.","a":"Critical thinking and problem solving; Creativity and innovation; Communication and collaboration; Cultural identity and global citizenship; Personal development and leadership; Digital literacy","d":["Literacy, numeracy, science, ICT, values and citizenship","Respect, diversity, equity, excellence, teamwork and integrity","Knowledge, comprehension, application, analysis, synthesis and evaluation"]},{"c":7,"g":"core-competences","q":"Which core competence has been used to guide the development of the Assessment Framework?","a":"All six core competences","d":["Only critical thinking and problem solving","Only digital literacy","Only communication and collaboration"]},{"c":7,"g":"assessing-comp","q":"Assessing which competence requires coursework (practical and hands-on activities) and a range of question types focused on specific themes?","a":"Critical thinking and problem solving","d":["Creativity and innovation","Communication and collaboration","Digital literacy"]},{"c":7,"g":"assessing-comp","q":"Assessing which competence requires individual and group projects, and creating products that solve a real-world problem?","a":"Creativity and innovation","d":["Critical thinking and problem solving","Cultural identity and global citizenship","Personal development and leadership"]},{"c":7,"g":"assessing-comp","q":"Assessing which competence requires teachers to create scenarios using role play, debate, drama or reflective dialogue?","a":"Communication and collaboration","d":["Creativity and innovation","Digital literacy","Cultural identity and global citizenship"]},{"c":7,"g":"assessing-comp","q":"Assessing which competence requires activities that bring learners' awareness to their culture and relate belief systems to a global context?","a":"Cultural identity and global citizenship","d":["Personal development and leadership","Communication and collaboration","Creativity and innovation"]},{"c":7,"g":"assessing-comp","q":"Assessing which competence requires learners to demonstrate self-esteem, self-awareness and self-confidence?","a":"Personal development and leadership","d":["Cultural identity and global citizenship","Communication and collaboration","Critical thinking and problem solving"]},{"c":7,"g":"assessing-comp","q":"Assessing which competence requires practical skills in digital communication and understanding of internet risks?","a":"Digital literacy","d":["Creativity and innovation","Personal development and leadership","Communication and collaboration"]},{"c":7,"g":"pre-tertiary-acc","q":"What is pre-tertiary education accreditation?","a":"A quality assurance process in which the services and operations of pre-tertiary schools, institutions or programmes are evaluated by an EXTERNAL body to determine whether applicable standards are met","d":["The internal review of school performance by the head","The inspection of teaching by circuit supervisors","The registration of teachers by the NTC"]},{"c":7,"g":"new-curriculum","q":"Which body introduced the New Standards-Based Curriculum for Basic Schools in Ghana?","a":"The National Council for Curriculum and Assessment (NaCCA)","d":["NaSIA","The NTC","The GES Council"]},{"c":7,"g":"new-curriculum","q":"The first phase of the new curriculum covers which levels?","a":"Kindergarten to Basic 6","d":["Basic 7 to Basic 10","Primary 1 to Primary 6","KG to JHS 3"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Syllabus' has been changed to what?","a":"Curriculum","d":["Strands","Scheme of Learning","Learning Plan"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Sections' or 'Units' are now called what?","a":"Strands","d":["Sub-strands","Content standards","Indicators"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Topics' are now called what?","a":"Sub-strands","d":["Strands","Content standards","Exemplars"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'General Objectives' are now known as what?","a":"Content Standards","d":["Content Indicators","Exemplars","Strands"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Specific Objectives' are now known as what?","a":"Content Indicators","d":["Content Standards","Exemplars","Sub-strands"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Teaching and Learning Activities' are now known as what?","a":"Exemplars","d":["Content indicators","Starters","Learning resources"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Relevant Previous Knowledge (RPK)' is now known as what?","a":"Learners' Entry Behaviour","d":["Starter","Exemplar","Content standard"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Circuit Supervisors' are now referred to as what?","a":"School Improvement Support Officers (SISOs)","d":["School Inspection Officers","Curriculum Support Officers","District Support Officers"]},{"c":7,"g":"new-terms","q":"What is the responsibility of School Improvement Support Officers?","a":"Inspecting and monitoring the work of teachers in all schools","d":["Preparing the curriculum","Licensing teachers","Approving school budgets"]},{"c":7,"g":"new-terms","q":"In the new curriculum, the 'Introduction' of a lesson is now referred to as what?","a":"The Starter","d":["The Exemplar","The Entry Behaviour","The Strand"]},{"c":7,"g":"new-terms","q":"In the new curriculum, School-Based INSET (SBI) is now known as what?","a":"Professional Learning Community (PLC)","d":["Teacher Resource Pack","Scheme of Learning","In-service Training Unit"]},{"c":7,"g":"new-terms","q":"In the new curriculum, Cluster-Based INSET is now known as what?","a":"Professional Learning Community","d":["School Improvement Support","Teacher Resource Pack","District Teacher Support Team"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Teachers' are now called what?","a":"Facilitators","d":["Instructors","Educators","Support officers"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Students/Pupils' are now called what?","a":"Learners","d":["Participants","Candidates","Trainees"]},{"c":7,"g":"new-terms","q":"In the new curriculum, the 'Teacher's Guide' is now called what?","a":"Teacher Resource Pack","d":["Scheme of Learning","Learning Plan","Curriculum Guide"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Scheme of Work' is now called what?","a":"Scheme of Learning","d":["Learning Plan","Teacher Resource Pack","Content Standard"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Lesson Plan' is now called what?","a":"Learning Plan","d":["Scheme of Learning","Starter","Exemplar"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'TLMs' are now called what?","a":"TLRs (Teaching and Learning Resources)","d":["Teacher Resource Packs","Exemplars","Learning Plans"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Topic' is now called what?","a":"Title","d":["Sub-strand","Strand","Starter"]},{"c":7,"g":"new-terms","q":"In the new curriculum, 'Head teacher' is now referred to as what?","a":"CEO","d":["SISO","Facilitator","Principal"]},{"c":7,"g":"becf","q":"What is the Basic Education Curriculum Framework (BECF) the outcome of?","a":"Extensive stakeholder engagement, a national needs assessment study, deliberations from a national curriculum reform conference and several benchmarking studies","d":["A decision of the GES Council","The Education Act 2008","An agreement between GES and NaCCA"]},{"c":7,"g":"becf","q":"Why was the BECF developed?","a":"To actualise the curriculum reforms","d":["To replace the syllabus","To standardise examinations","To set teacher standards"]},{"c":7,"g":"rationale","q":"What is the fundamental rationale for reviewing the curriculum?","a":"To shift the structure and content of education from merely passing examinations to building character, nurturing values, and raising literate, confident, engaged citizens who can think critically","d":["To reduce the length of the school year","To increase the number of subjects","To align with international examinations"]},{"c":7,"g":"rationale","q":"On which subjects does the curriculum review place emphasis as fundamental building blocks for success?","a":"Science and mathematics","d":["English and Ghanaian language","ICT and Creative Arts","Social Studies and RME"]},{"c":7,"g":"rationale","q":"The curriculum review aims to ensure content can be what?","a":"Internationally benchmarked","d":["Locally standardised","Reduced in volume","Examined by WAEC"]},{"c":7,"g":"old-curriculum","q":"Which curriculum design model did the PREVIOUS pre-tertiary curriculum follow?","a":"The objective-based curriculum design model","d":["The standards-based curriculum model","The competence-based model","The experience-based model"]},{"c":7,"g":"old-curriculum","q":"What was the previous curriculum officially defined by?","a":"Subject syllabuses","d":["Content standards","Strands and sub-strands","Learning outcomes"]},{"c":7,"g":"old-curriculum","q":"Which teaching approach did classrooms tend to favour under the old curriculum, despite emphasising activity-based learning?","a":"An expository or didactic, largely TEACHER-CENTRED approach","d":["A learner-centred approach","An inquiry-based approach","A project-based approach"]},{"c":7,"g":"old-curriculum","q":"Under the old curriculum, which language was the medium of instruction for kindergarten and the first three years of primary?","a":"The local Ghanaian language","d":["English","French","A mixture of English and local language"]},{"c":7,"g":"old-curriculum","q":"What replaced continuous assessment under the old curriculum, with a focus on Class Assessment Tasks (CATs)?","a":"School-Based Assessment (SBA)","d":["The NSAT","Formative evaluation","Criterion-referenced testing"]},{"c":7,"g":"curr-def-prescriptive","q":"Which curriculum definitions provide us with what 'OUGHT' to happen — a plan, intended programme, or expert opinion?","a":"Prescriptive definitions","d":["Descriptive definitions","Experiential definitions","Process definitions"]},{"c":7,"g":"curr-def-prescriptive","q":"Who defined curriculum as 'the entire range of experiences, both direct and undirected, concerned in unfolding the abilities of the individual'?","a":"Bobbitt (1918)","d":["Tyler (1953)","Caswell and Campbell (1935)","Ragan (1960)"]},{"c":7,"g":"curr-def-prescriptive","q":"Who defined curriculum as 'all the learning experiences planned and directed by the school to attain its educational goals'?","a":"Tyler (1953)","d":["Bobbitt (1918)","Kerr (1968)","Hass (1987)"]},{"c":7,"g":"curr-def-descriptive","q":"Which curriculum definitions go beyond prescription to describe how things ARE in classrooms (Ellis, 2004)?","a":"Descriptive definitions","d":["Prescriptive definitions","Normative definitions","Structural definitions"]},{"c":7,"g":"curr-def-descriptive","q":"Which term could also be used to define the descriptive curriculum?","a":"Experience","d":["Syllabus","Plan","Programme"]},{"c":7,"g":"curr-def-descriptive","q":"Who defined curriculum as 'all the experiences children have under the guidance of teachers'?","a":"Caswell and Campbell (1935)","d":["Ragan (1960)","Bobbitt (1918)","Hass (1987)"]},{"c":7,"g":"curr-def-descriptive","q":"Who perceived curriculum as 'the experience of the child for which the school accepts responsibility'?","a":"Ragan (1960)","d":["Caswell and Campbell (1935)","Tyler (1953)","Silva (2010)"]},{"c":7,"g":"curr-def-descriptive","q":"Who defined curriculum as 'the set of actual experiences and perceptions of the experience that each individual learner has of his or her program of education'?","a":"Hass (1987)","d":["Ragan (1960)","Kerr (1968)","Silva (2010)"]},{"c":7,"g":"curr-def-descriptive","q":"Who said the essence of 21st-century skills is an emphasis on what students can DO with knowledge rather than what units of knowledge they have?","a":"Silva (2010)","d":["Hass (1987)","Ellis (2004)","Kerr (1968)"]},{"c":7,"g":"curr-def-both","q":"Who defined curriculum as 'all the learning which is planned and guided by the school, whether carried on in groups or individually, inside or outside of the school'?","a":"Kerr (1968)","d":["Tyler (1953)","Hass (1987)","Bobbitt (1918)"]},{"c":7,"g":"curr-elements","q":"According to Brady (1995), what are the four elements of curriculum?","a":"Objectives, contents, methods and evaluation","d":["Aims, goals, objectives and outcomes","Strands, sub-strands, standards and indicators","Planning, teaching, assessing and reporting"]},{"c":7,"g":"curr-elements","q":"Which is a component of curriculum listed in the handbook?","a":"Statements of philosophy of the educational programme","d":["Timetable of school activities","Staff appraisal system","School budget"]},{"c":7,"g":"curr-types","q":"Which type of curriculum covers subjects like English, Mathematics, ICT, Science, History, Geography and Economics?","a":"Subject-based/oriented curriculum","d":["Core curriculum","Hidden curriculum","Official curriculum"]},{"c":7,"g":"curr-types","q":"Which type of curriculum is exemplified by English, Mathematics, ICT and Science?","a":"Core curriculum","d":["Subject-based curriculum","Hidden curriculum","Experience-based curriculum"]},{"c":7,"g":"curr-types","q":"Which type of curriculum is exemplified by sports, music, language and moral instruction?","a":"Hidden/unofficial curriculum","d":["Core curriculum","Subject-based curriculum","Official curriculum"]},{"c":7,"g":"curr-types","q":"Which is a listed TYPE of curriculum?","a":"Competence-based curriculum","d":["Diagnostic curriculum","Summative curriculum","Norm-referenced curriculum"]},{"c":7,"g":"curr-frameworks","q":"How many curriculum frameworks currently drive education in Ghana?","a":"Two","d":["One","Three","Four"]},{"c":7,"g":"curr-frameworks","q":"Name the two curriculum frameworks in Ghana.","a":"The Pre-Tertiary Education Curriculum Framework (PECF) and the National Teacher Education Curriculum Framework (NTECF)","d":["The BECF and the NTECF","The PECF and the BECF","The NTECF and the CCP"]},{"c":7,"g":"syllabus","q":"From which language and word is 'syllabus' derived?","a":"Modern Latin 'syllabus', meaning 'list'","d":["Greek 'syllabos', meaning 'lesson'","Latin 'silaba', meaning 'sound'","French 'syllabe', meaning 'part'"]},{"c":7,"g":"syllabus","q":"The Latin 'syllabus' was originally carved from which Greek word, meaning what?","a":"The Greek 'syllabus', meaning 'parchment table' or 'table of contents'","d":["The Greek 'syllogos', meaning 'gathering'","The Greek 'syllabe', meaning 'syllable'","The Greek 'sylla', meaning 'list'"]},{"c":7,"g":"syllabus","q":"How is a syllabus defined?","a":"An academic document that communicates information about a specific subject and defines expectations and responsibilities; a document consisting of topics or portions covered in a particular subject","d":["The totality of students' experiences in education","All learning planned and guided by the school","The interaction of teachers, students and knowledge"]},{"c":7,"g":"syllabus","q":"Which body prepares the syllabus?","a":"The National Council for Curriculum and Assessment (NaCCA), formerly the Curriculum Research and Development Division (CRDD)","d":["WAEC","NaSIA","The NTC"]},{"c":7,"g":"syllabus","q":"According to Hoesny (2013), how many possible functions does a syllabus have?","a":"17","d":["12","15","20"]},{"c":7,"g":"syllabus-func","q":"Which is a function of a syllabus per Hoesny?","a":"Constituting a contract","d":["Setting examination questions","Recruiting teachers","Allocating school funds"]},{"c":7,"g":"syllabus-func","q":"Which is a function of a syllabus per Hoesny?","a":"Permitting self-monitoring","d":["Grading students' work","Appraising teachers","Auditing school accounts"]},{"c":7,"g":"syllabus-func","q":"Which is a function of a syllabus per Hoesny?","a":"Meeting accreditation requirements","d":["Licensing teachers","Determining school fees","Selecting textbooks for purchase"]},{"c":7,"g":"perspectives","q":"According to Kelly (1999), from how many perspectives could curriculum be understood?","a":"Four","d":["Three","Five","Two"]},{"c":7,"g":"perspectives","q":"Name the four perspectives of curriculum (Kelly, 1999).","a":"Curriculum as a body of knowledge to be transmitted (syllabus); as an attempt to achieve certain ends in students (product); as a process; and as praxis","d":["Prescriptive, descriptive, formal and informal","Subject-based, core, hidden and official","Objectives, content, methods and evaluation"]},{"c":7,"g":"perspectives","q":"Which curriculum perspective equates curriculum with a syllabus — a concise statement of the heads of a discourse?","a":"Curriculum as a body of knowledge to be transmitted","d":["Curriculum as product","Curriculum as process","Curriculum as praxis"]},{"c":7,"g":"perspectives","q":"In the 'body of knowledge' perspective, curriculum is associated with which kind of body?","a":"An examination body such as the West African Examinations Council","d":["A teacher training institution","A school board","A curriculum development council"]},{"c":7,"g":"perspectives","q":"Which curriculum perspective sets out how the objectives and contents of what is taught might be learned, giving detailed attention to what students need to know to work or enjoy their lives?","a":"Curriculum as product","d":["Curriculum as a body of knowledge","Curriculum as process","Curriculum as praxis"]},{"c":7,"g":"perspectives","q":"Which curriculum perspective says curriculum is NOT a physical thing but the INTERACTION of teachers, students and knowledge?","a":"Curriculum as process","d":["Curriculum as product","Curriculum as praxis","Curriculum as a body of knowledge"]},{"c":7,"g":"perspectives","q":"Which curriculum perspective is described as 'informed, committed action' and a development of the process model?","a":"Curriculum as praxis","d":["Curriculum as process","Curriculum as product","Curriculum as syllabus"]},{"c":7,"g":"perspectives","q":"Which curriculum perspective makes continual reference to collective human well-being and how to emancipate the human spirit?","a":"Curriculum as praxis","d":["Curriculum as process","Curriculum as product","Curriculum as a body of knowledge"]},{"c":7,"g":"npec","q":"What is the AIM of the National Pre-Tertiary Education Curriculum of Ghana?","a":"To turn out graduates who are good problem solvers, can think creatively, and have the confidence and competence to participate fully in Ghanaian society as responsible local and global citizens","d":["To prepare learners for the WASSCE","To increase enrolment in science and mathematics","To align Ghana's curriculum with international standards"]},{"c":7,"g":"npec","q":"Which is an objective of the curriculum framework?","a":"Promote financial literacy, including the development of entrepreneurial skills for all learners","d":["Increase the number of examinable subjects","Reduce the length of the school day","Standardise textbooks nationally"]},{"c":7,"g":"npec","q":"Which is an objective of the curriculum framework regarding languages?","a":"Encourage learners to learn a Ghanaian language AND a modern foreign language as part of becoming a global citizen","d":["Make English the sole medium of instruction","Abolish the study of Ghanaian languages","Make French compulsory at all levels"]},{"c":7,"g":"npec","q":"Which subject does the curriculum framework describe as a fundamental building block for learning other subjects?","a":"Mathematics","d":["English Language","Integrated Science","ICT"]},{"c":7,"g":"core-values","q":"Name the six core values of the National Pre-Tertiary Education Curriculum.","a":"Respect; Diversity; Equity; Commitment to achieving excellence; Teamwork/collaboration; Truth and integrity","d":["Honesty, discipline, hard work, unity, respect and service","Access, equity, quality, relevance, efficiency and accountability","Critical thinking, creativity, communication, citizenship, leadership and digital literacy"]},{"c":7,"g":"pedagogy","q":"What is pedagogy?","a":"The interaction between teacher, learners, the learning environment and learning tasks","d":["The content of what is taught","The method of assessing learners","The plan of learning experiences"]},{"c":7,"g":"pedagogy","q":"Which pedagogical approach positions the TEACHER at the centre and relies on whole-class lecture, rote memorisation and chorus answers?","a":"Teacher-centred pedagogy","d":["Learner-centred pedagogy","Inquiry-based pedagogy","Constructivist pedagogy"]},{"c":7,"g":"pedagogy","q":"Which pedagogical approach draws on learning theories suggesting learners should play an ACTIVE role, using prior knowledge and new experience to create knowledge?","a":"Learner-centred pedagogy","d":["Teacher-centred pedagogy","Didactic pedagogy","Expository pedagogy"]},{"c":7,"g":"pedagogy-content","q":"What does pedagogical knowledge deal with?","a":"The teaching process, including the ways of representing and formulating the subject to make it comprehensible to others (methodology)","d":["The specific topics or subject matter taught","The assessment of learners","The management of the classroom"]},{"c":7,"g":"pedagogy-content","q":"What does CONTENT deal with?","a":"Specific topics or subject matters (curricula) that are taught, which may change from time to time since society is dynamic","d":["The method of presenting a subject","The interaction between teacher and learner","The environment in which learning occurs"]},{"c":7,"g":"pedagogy-content","q":"For teachers to be successful, how must pedagogy and content be treated?","a":"They must be confronted SIMULTANEOUSLY and blended, so the teacher can interpret the subject matter and make it accessible to learners","d":["Content should be mastered before pedagogy","Pedagogy should be mastered before content","They should be treated as separate concerns"]},{"c":7,"g":"ccp","q":"What is the Common Core Programme (CCP)?","a":"The second phase of the pre-tertiary curriculum review — a carefully designed programme of nine subjects for learners in Basic 7 to Basic 10 (JHS 1 – SHS 1)","d":["The first phase of the curriculum review, from KG to Primary 6","A programme of core subjects for SHS 2 and 3","A vocational programme for TVET learners"]},{"c":7,"g":"ccp","q":"In what year did the pre-tertiary curriculum review start?","a":"2017","d":["2019","2018","2016"]},{"c":7,"g":"ccp","q":"Since what year has the KG–Primary 6 curriculum been implemented by GES?","a":"2019 (introduced September 2019)","d":["2017","2018","2020"]},{"c":7,"g":"ccp","q":"How long is the Common Core Programme?","a":"Four (4) years","d":["Three (3) years","Two (2) years","Five (5) years"]},{"c":7,"g":"ccp","q":"Which languages fall under the 'Languages' subject of the CCP?","a":"English, Ghanaian Language, Arabic and French","d":["English, French and Ghanaian Language only","English and Ghanaian Language only","English, French, Spanish and Arabic"]},{"c":7,"g":"ccp","q":"Under the CCP, at what level is the NSAT conducted, and why?","a":"At JHS 2 (Basic 8), to generate data for improvement at all levels of management and implementation","d":["At JHS 3, to place students into SHS","At SHS 1, to guide programme selection","At Primary 6, to assess literacy"]},{"c":7,"g":"ccp","q":"'HSDP' under the CCP stands for what?","a":"High School Diploma Programmes","d":["High School Development Plan","High School Diploma Pathway","Higher Secondary Diploma Programme"]},{"c":7,"g":"ccp","q":"'CRP' under the CCP stands for what?","a":"Career-Related Programmes","d":["Core Related Programme","Curriculum Review Programme","Career Readiness Pathway"]},{"c":7,"g":"ccp","q":"From SHS 2 to 3 under the CCP, what do students decide?","a":"Whether to pursue a career-related programme, an academic one, or both","d":["Whether to remain in school","Which examination to write","Which school to attend"]},{"c":7,"g":"ccp","q":"What will be integrated as part of comprehensive learner assessment under the CCP?","a":"Project work, community service and engagement — emphasising DOING","d":["More frequent written examinations","Continuous assessment tests only","External examinations at each level"]},{"c":7,"g":"ccp","q":"Why was the Common Core Programme introduced?","a":"To build character and nurture values, ensure seamless progression from JHS to SHS, and create clear pathways for academic and career-related programmes","d":["To reduce the number of subjects studied","To shorten the duration of secondary school","To align with WAEC examination requirements"]},{"c":7,"g":"ccp","q":"What is 'rote learning' described as in the CCP context?","a":"Memorising facts and figures without being able to apply knowledge innovatively to solve everyday problems","d":["Learning through repetition and practice","Learning by doing projects","Learning through group discussion"]},{"c":7,"g":"ccp","q":"In which year was the National Pre-Tertiary Curriculum Framework published, and by whom?","a":"2018, by NaCCA","d":["2019, by GES","2017, by the Ministry of Education","2018, by NaSIA"]},{"c":7,"g":"curr-dev","q":"Which factor is considered when designing a curriculum for schools?","a":"Age-maturity levels to understand what is to be taught","d":["The number of teachers available","The school's examination results","The size of the school building"]},{"c":7,"g":"curr-dev","q":"Which factor is considered when designing a curriculum for schools?","a":"National aspirations — the needs of society or national direction, e.g. study of science and technology, ICT","d":["Teachers' subject preferences","Parents' occupational background","The district's budget allocation"]},{"c":7,"g":"curr-dev","q":"Which factor is considered when designing a curriculum, requiring child-centred rather than subject-centred activities?","a":"The needs of the child, so pupils can develop their inherent talent","d":["The needs of the teacher","The needs of the examination body","The needs of the district assembly"]},{"c":7,"g":"curr-dev","q":"Why must the SEQUENCE of topics be considered in curriculum design?","a":"So topics build logically, e.g. addition, division, multiplication in Arithmetic","d":["So teachers can plan their holidays","So examinations can be set easily","So textbooks can be printed cheaply"]},{"c":7,"g":"co-curriculum","q":"What are CURRICULUM activities?","a":"The examinable subjects taught in the classroom, science laboratories and workshops","d":["Non-examinable disciplines taught outside the main timetable","Games, sports, culture and clubs","Moral education taught through school worship"]},{"c":7,"g":"co-curriculum","q":"What are CO-CURRICULUM activities?","a":"The other school NON-EXAMINABLE disciplines/subjects taught outside the main official timetable","d":["Examinable subjects taught in the classroom","Subjects taught in laboratories and workshops","Subjects included in the standards-based curriculum"]},{"c":7,"g":"co-curriculum","q":"Which of these is a co-curricular activity?","a":"Games and sports, culture, clubs and societies, school worship and other school gatherings","d":["Mathematics and Integrated Science","Business and Technical programmes","Religious and Moral Education classes"]},{"c":7,"g":"co-curriculum","q":"Should teachers scheduled to handle co-curricular activities expect additional remuneration?","a":"No — they are part of the school programme and do not attract any remuneration","d":["Yes, at 10% of basic salary","Yes, as a responsibility allowance","Yes, if approved by the head"]},{"c":7,"g":"co-curriculum","q":"What do co-curricular activities teach and encourage?","a":"The spirit of competition, tolerance, cooperation and teamwork, plus discipline and moral education","d":["Only physical fitness","Only competitive spirit","Only academic excellence"]},{"c":7,"g":"co-curriculum","q":"In the absence of moral education on the official timetable, how does the school still teach it?","a":"Through co-curricular activities and academic subjects like literature and history","d":["Through RME classes only","Through school assembly announcements","Through the code of conduct"]},{"c":7,"g":"methodology","q":"What is emphasised in Teacher Education regarding methodology?","a":"'How to teach' — leading the pupil to understand and assimilate what is taught with little or no difficulty","d":["'What to teach' — mastering the subject matter","'When to teach' — timetabling","'Whom to teach' — pupil selection"]},{"c":7,"g":"methodology","q":"What are the two main approaches (methods) to teaching?","a":"Inductive and Deductive","d":["Didactic and Dictatorial","Demonstrative and Creative","Direct and Indirect"]},{"c":7,"g":"methodology","q":"What is the INDUCTIVE method?","a":"Leading the pupil to DISCOVER what is to be established (the principle) through questioning, answers and experiments","d":["Stating a principle and having pupils prove its validity","Demonstrating a skill for pupils to copy","Dictating step-by-step what to do"]},{"c":7,"g":"methodology","q":"What is the DEDUCTIVE method?","a":"Making a statement or stating a principle first, then leading pupils to PROVE the validity of the statement through questioning, answers and experiments","d":["Leading pupils to discover a principle through experiment","Combining participation and demonstration","Tapping the inherent talent of pupils"]},{"c":7,"g":"methodology","q":"In the metals experiment, what conclusion do pupils reach under the INDUCTIVE method?","a":"That metals expand when heated whereas non-metals do not","d":["That metals conduct heat better than non-metals","That wood is a poor conductor","That heating changes the colour of metals"]},{"c":7,"g":"methodology","q":"What practical application illustrates metal expansion?","a":"Spaces left between rails when constructing rail lines, to allow for expansion in the sun's heat","d":["The use of copper in electrical wires","The use of wood in furniture","The insulation of buildings"]},{"c":7,"g":"methodology","q":"What ADVANTAGE does the inductive method have over the deductive method?","a":"Pupils do not easily forget their findings or discoveries","d":["It takes less classroom time","It requires fewer materials","It is easier for the teacher to prepare"]},{"c":7,"g":"principles-teaching","q":"Name the three principles of teaching listed in Chapter Seven.","a":"Proceeding from known to unknown (familiar to unfamiliar); easy/simple to difficult/complex; and concrete (real objects) to abstract (imaginary)","d":["Simple to complex, part to whole, particular to general","Known to unknown, whole to part, general to particular","Concrete to abstract, general to particular, complex to simple"]},{"c":7,"g":"principles-teaching","q":"What are principles of teaching?","a":"Rules or foundations followed when teaching a new topic, which offer pupils the opportunity to participate actively","d":["Methods of assessing pupils' learning","Rules governing teacher conduct","Guidelines for preparing lesson notes"]},{"c":7,"g":"specific-methods","q":"Which teaching method dictates exactly what to do step by step with lots of directions, and is recommended for KG and Primary 1?","a":"The dictatorial method","d":["The didactic method","The demonstrative method","The creative method"]},{"c":7,"g":"specific-methods","q":"Which teaching method follows a consistent scientific approach to engage the pupil's mind, and is recommended at JHS level?","a":"The didactic method","d":["The dictatorial method","The demonstrative method","The interactive method"]},{"c":7,"g":"specific-methods","q":"Which teaching method combines participation, demonstration, recitation and memorisation, relying on showing the learner a model performance?","a":"The demonstrative method","d":["The didactic method","The creative method","The interactive method"]},{"c":7,"g":"specific-methods","q":"At which levels can the demonstrative method be used?","a":"JHS, Primary and KG","d":["SHS and tertiary only","JHS and SHS only","Primary and JHS only"]},{"c":7,"g":"specific-methods","q":"Which teaching method is used to tap the inherent talent of the pupil, taking account of the culture and aspirations of the country?","a":"The creative method","d":["The demonstrative method","The interactive method","The didactic method"]},{"c":7,"g":"specific-methods","q":"At which levels is the creative method recommended?","a":"Primary, JHS and sometimes SHS","d":["KG and Primary only","JHS and SHS only","KG only"]},{"c":7,"g":"specific-methods","q":"Which teaching method involves giving students something to do, getting back what they have done, and assimilating it to decide what to do next?","a":"The interactive method","d":["The demonstrative method","The creative method","The didactic method"]},{"c":7,"g":"specific-methods","q":"At which levels can the interactive method be used?","a":"KG and Primary levels","d":["JHS and SHS","SHS and tertiary","Primary and JHS"]},{"c":7,"g":"language-theory","q":"Who propounded the Stimulus-Response-Reward theory in language teaching?","a":"Skinner","d":["Chomsky","Piaget","Bruner"]},{"c":7,"g":"language-theory","q":"Whose theory states that language teaching and learning must be based on RULES and the STRUCTURE of language?","a":"Chomsky","d":["Skinner","Thorndike","Vygotsky"]},{"c":7,"g":"language-theory","q":"Which language teaching theory do language experts/specialists recommend as more effective?","a":"Chomsky's theory (rules and structure of language)","d":["Skinner's Stimulus-Response-Reward theory","Thorndike's laws of learning","Bloom's taxonomy"]},{"c":7,"g":"methods-list","q":"Which of these is a listed method of teaching?","a":"Play way method","d":["Dictatorial method","Interactive method","Creative method"]},{"c":7,"g":"methods-list","q":"Which of these is a listed method of teaching?","a":"Field trip/excursion method","d":["Didactic method","Demonstrative method","Inductive method"]},{"c":7,"g":"methods-list","q":"Which of these is a listed method of teaching?","a":"Project method","d":["Creative method","Interactive method","Dictatorial method"]},{"c":7,"g":"teacher-skills","q":"Which skill should a teacher acquire in modern technology?","a":"Ability to use the computer to access information on the internet and manage class records","d":["Ability to repair computers","Ability to write computer programmes","Ability to design websites"]},{"c":7,"g":"teacher-skills","q":"How is modern technology defined in the handbook?","a":"The collective body of techniques, skills, methods and processes used in the production of goods and services, and for research purposes","d":["The use of computers and the internet only","Electronic devices used in teaching","Digital tools for assessment"]},{"c":7,"g":"qualities","q":"Which is a listed quality of a good teacher?","a":"Mastery of subjects","d":["High academic qualification","Long service","Membership of a teacher union"]},{"c":7,"g":"qualities","q":"Which is a listed quality of a good teacher?","a":"Initiating contact with parents","d":["Strict discipline","Regular attendance at church","Involvement in politics"]},{"c":7,"g":"qualities","q":"Which is a listed quality of a good teacher?","a":"Keeping the diary","d":["Writing research papers","Attending workshops","Supervising examinations"]},{"c":7,"g":"teacher-roles7","q":"Which is a listed ROLE of a teacher?","a":"Curriculum specialist","d":["Curriculum designer","Examination officer","School ve been IMPLEMENTED after preparation?","a":"Ten years","d":["Five years","Two years","Fifteen years"]},{"c":8,"g":"fcube","q":"Ghana's long-term vision of becoming a middle income country by 2020 was reviewed to which year?","a":"2015","d":["2025","2030","2010"]},{"c":8,"g":"fcube","q":"Which is a CONSTRAINT that FCUBE was designed to address?","a":"Weak management capacity at all levels of the educational system","d":["Excess funding of the education sector","Too many trained teachers","Oversupply of textbooks"]},{"c":8,"g":"fcube","q":"Which is a CONSTRAINT that FCUBE was designed to address?","a":"Unsatisfactory financing arrangement for the education sector","d":["Excessive access to education services","Strong management capacity","High pupil performance"]},{"c":8,"g":"fcube-objectives","q":"How many main areas (objectives) does FCUBE focus on?","a":"Three","d":["Two","Four","Five"]},{"c":8,"g":"fcube-objectives","q":"Name the three focus areas of FCUBE.","a":"Improving quality teaching and learning; improving the efficiency and effectiveness of management performance; and ensuring access and participation","d":["Access, equity and quality","Teaching, learning and assessment","Infrastructure, staffing and funding"]},{"c":8,"g":"fcube-objectives","q":"Under FCUBE, which strategy improves teacher morale and motivation?","a":"Incentive programmes","d":["Increased supervision","Stricter discipline","More frequent inspections"]},{"c":8,"g":"fcube-objectives","q":"Under FCUBE, teacher-community relationships are improved through which body?","a":"The School Management Committees","d":["The PTA","The DEOC","The Board of Governors"]},{"c":8,"g":"fcube-objectives","q":"Under FCUBE management reforms, what was created at district level?","a":"Decentralisation and the creation of the 4 front-line ADs/DDs and circuits","d":["The DEOC and the DDC","The SMC and PTA","Regional education offices"]},{"c":8,"g":"fcube-objectives","q":"Under FCUBE, who is the front-line manager "]},{"c":8,"g":"girl-child","q":"Which component of FCUBE stresses gender equality in enrolment and high retention for the girl-child?","a":"The third component — Access and Participation","d":["The first component — Quality teaching and learning","The second component — Management efficiency","A separate fourth component"]},{"c":8,"g":"girl-child","q":"What is the objective of promoting girl-child education?","a":"To achieve women's empowerment and solve the gender imbalance in our social set-up","d":["To increase enrolment figures","To meet international targets","To reduce the number of school dropouts"]},{"c":8,"g":"girl-child","q":"To what is the gender gap or imbalance attributed?","a":"Social and cultural barriers that have discouraged women and girls from seeking equal opportunities","d":["Lack of school infrastructure","Poor teaching quality","Inadequate funding"]},{"c":8,"g":"girl-child","q":"Where have girl-child education units been created?","a":"At GES Headquarters in Accra, and at regional and district offices","d":["Only at GES Headquarters","Only at district offices","Only in deprived districts"]},{"c":8,"g":"girl-child","q":"Who heads the girl-child education units?","a":"Girl-child coordinators","d":["Circuit supervisors","Deputy directors of HRMD","Social welfare officers"]},{"c":8,"g":"girl-child","q":"In schools, who is given the schedule for girl-child education?","a":"Model female teachers","d":["The head teacher","The school counsellor","The senior housemistress"]},{"c":8,"g":"girl-child","q":"'STME' clinics organised by GES for girls stand for what?","a":"Science, Technology and Mathematics Education clinics","d":["Science, Technical and Mathematics Enrichment","Secondary Technology and Mathematics Education","Science, Teaching and Mathematics Excellence"]},{"c":8,"g":"girl-child","q":"What is the purpose of STME clinics for girls?","a":"To generate interest in subjects considered to be boys' subjects and remove the phobia or fear for them"  the Free Textbook Scheme?","a":"Books supplied to schools are too inadequate for each pupil to have a copy","d":["Too many books are supplied","Books are too expensive to print","Books arrive too early"]},{"c":8,"g":"textbook","q":"Which subjects are noted as lacking standard textbooks?","a":"Ghanaian language, technical and vocational subjects","d":["Mathematics and Science","English and Social Studies","RME and ICT"]},{"c":8,"g":"textbook","q":"Before pupils may carry textbooks home for studies, what is required?","a":"They must be guaranteed by parents","d":["They must pay a deposit","They must obtain the head teacher's approval","They must sign a register"]},{"c":8,"g":"textbook","q":"From which academic year did the government absorb all textbook levies?","a":"2005/6","d":["2004/5","2006/7","2007/8"]},{"c":8,"g":"textbook","q":"Which fund should support the free textbooks scheme in deprived areas?","a":"The GET Fund","d":["The Consolidated Fund","The Heritage Fund","The District Assembly Common Fund"]},{"c":8,"g":"cssps","q":"What does CSSPS seek to replace?","a":"The manual system of selection and placement of qualified BECE candidates into public and private SHS, technical and vocational institutions","d":["The BECE examination itself","The WASSCE examination","The school-based assessment system"]},{"c":8,"g":"cssps","q":"Which is a shortcoming of the MANUAL selection and placement system?","a":"Human errors arising from long, two-stage admission processes and loss of cards","d":["Excessive transparency","Low administrative cost","Too many placement options"]},{"c":8,"g":"cssps","q":"Which is a shortcoming of the manual system regarding heads of schools?","a":"Alleged abuse by some heads of their discretionary powers to select candidates","d":["Heads had no role in selection","Heads had too little discretion","Heads were overworked"]},{"c":8,"g":"cssps","q":"Under the manual system, candidates were restricted to how many regions in their choice of schools?","a":"One region","d":["Two regions","Three regions","No restriction"]},{"c":8,"g":"cssps","q":"Which is a BENEFIT of the CSSPS?","a":"Candidates can select schools from the ten regions and any district of their choice, removing regional restrictions","d":["Schools can choose their own students","Placement takes longer but is more accurate","Regional meetings continue as before"]},{"c":8,"g":"cssps","q":"Which is a BENEFIT of the CSSPS?","a":"The yearly regional meetings will stop and GES will make financial savings","d":["More regional meetings will be held","Placement costs will rise","More staff will be needed"]},{"c":8,"g":"cssps-ops","q":"Under CSSPS, are SCORES or GRADES processed for selection?","a":"SCORES (not grades)","d":["Grades (not scores)","Both scores and grades","Aggregates only"]},{"c":8,"g":"cssps-ops","q":"Which subjects' scores are used in CSSPS for SHS students?","a":"English Language, Mathematics, Integrated Science, Social Studies, plus the student's best scores in two other subjects","d":["English, Mathematics, Science and ICT","English, Mathematics, Science and RME","All nine BECE subjects equally"]},{"c":8,"g":"cssps-ops","q":"Which subject replaces Social Studies for TECHNICAL students under CSSPS?","a":"Pre-Technical Skills","d":["Basic Design and Technology","ICT","Pre-Vocational Skills"]},{"c":8,"g":"cssps-ops","q":"Must candidates write all subjects to qualify for CSSPS selection?","a":"Yes — candidates are required to write all subjects","d":["No, only the four core subjects","No, only six subjects","No, only their best subjects"]},{"c":8,"g":"cssps-ops","q":"On what basis does the computer do the selection and placement?","a":"On candidates' performance and the choices (school and programme) made","d":["On the candidate's region of residence","On the candidate's school of origin","On a random allocation"]},{"c":8,"g":"cssps-ops","q":"With effect from which academic year should 30% of each school's admission come from the local community?","a":"2011/2012","d":["2010/2011","2012/2013","2005/2006"]},{"c":8,"g":"cssps-ops","q":"What percentage of each school's admission should come from the community in which the school is situated?","a":"30%","d":["20%","40%","50%"]},{"c":8,"g":"cssps-challenges","q":"Which is a CHALLENGE of CSSPS relating to Old Students' Associations?","a":"They are collapsing because CSSPS does not make room for incentive/protocol admissions for their wards","d":["They have become too powerful","They now control admissions","They receive too much funding"]},{"c":8,"g":"cssps-challenges","q":"Which 1987 concept is the CSSPS alleged to defeat?","a":"The community Senior High School concept — providing doorstep access at community level through day schooling","d":["The boarding school system","The continuous assessment system","The vocational education concept"]},{"c":8,"g":"cssps-challenges","q":"Which is a CHALLENGE of CSSPS for parents?","a":"Parents become traumatised when the computer places wards in schools far away from their region, especially without boarding facilities","d":["Parents must select schools too early","Parents cannot see the results","Parents must pay placement fees"]},{"c":8,"g":"free-shs","q":"In which year was the Free SHS policy introduced?","a":"2017","d":["2013","2016","2018"]},{"c":8,"g":"free-shs","q":"Which programmes does the Free SHS policy cover?","a":"General Arts, General Science, Business, Vocational/Technical, Agriculture and Visual Arts","d":["General Arts, General Science and Business only","All programmes except Vocational/Technical","Only the core academic programmes"]},{"c":8,"g":"free-shs","q":"Who is responsible for the extra years of a student who REPEATS a class under Free SHS?","a":"The student (and family) — they must be responsible for the extra years","d":["The government continues to pay","The school absorbs the cost","The District Assembly pays"]},{"c":8,"g":"free-shs","q":"From which fund does Free SHS funding come?","a":"The
